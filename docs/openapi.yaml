                - type: "null"
            action:
              type: string
              enum:
                - sign_in
            expectedUserID:
              $ref: "#/components/schemas/Model/properties/id"
        - type: object
          additionalProperties: false
          required:
            - expectedVersion
            - expectedSessionID
            - action
            - expectedUserID
          properties:
            expectedVersion:
              $ref: "#/components/schemas/AccountFlowVersion"
            expectedSessionID:
              oneOf:
                - $ref: "#/components/schemas/Model/properties/id"
                - type: "null"
            action:
              type: string
              enum:
                - create_user
            expectedUserID:
              type: "null"
