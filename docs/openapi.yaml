        code:
          type: integer
          enum:
            - 40900
        msg:
          description: Safe diagnostic string. Do not parse it.
          type: string
          minLength: 1
        reason:
          $ref: "#/components/schemas/AccountFlowConflictReason"
      examples:
        - code: 40900
          msg: Conflict
          reason: request_changed

    AccountFlowExpiredError:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - reason
      properties:
        code:
          type: integer
          enum:
            - 41000
        msg:
          description: Safe diagnostic string. Do not parse it.
          type: string
          minLength: 1
        reason:
          type: string
          enum:
            - request_expired
            - proof_expired
      examples:
        - code: 41000
          msg: Gone
          reason: proof_expired

    SignInPlatform:
      type: string
      enum:
        - web
        - wechat_mini_program
        - wechat_web_view

    SignInRequestID:
      description: Opaque local product sign-in request reference. It is not an Account request URI.
      type: string
      minLength: 1

    ProductReturnPath:
      description: |
        Valid path within the product. The backend validates and fixes it at creation and rejects external
        destinations.
      type: string
      minLength: 1
      pattern: "^/(?!/)"

    AccountAuthorizationEntryDescriptor:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - facade
            - entryPurpose
            - url
            - expiresAt
          properties:
            facade:
              type: string
              enum:
                - web
            entryPurpose:
              $ref: "#/components/schemas/AccountEntryPurpose"
            url:
              description: Account browser entry. Authorize uses the OAuth authorize endpoint. Return opens Account Web directly.
              type: string
              minLength: 1
              format: uri
            expiresAt:
              description: One-time entry deadline.
              type: string
              minLength: 1
              format: date-time
        - type: object
          additionalProperties: false
          required:
            - facade
            - entryPurpose
            - miniProgramAppID
            - path
            - extraData
            - expiresAt
          properties:
            facade:
              type: string
              enum:
                - wechat
            entryPurpose:
              $ref: "#/components/schemas/AccountEntryPurpose"
            miniProgramAppID:
              $ref: "#/components/schemas/AccountWechatMiniProgramAppID"
            path:
              description: Configured Account page path with only public `clientID` and `requestURI` query parameters.
              type: string
              minLength: 1
            extraData:
              type: object
              additionalProperties: false
              required:
                - entryToken
              properties:
                entryToken:
                  $ref: "#/components/schemas/AccountOpaqueCredential"
            expiresAt:
              description: One-time entry deadline.
              type: string
              minLength: 1
              format: date-time

    CreateSignInRequest:
      type: object
      additionalProperties: false
      required:
        - platform
        - returnTo
      properties:
        platform:
          $ref: "#/components/schemas/SignInPlatform"
        returnTo:
          $ref: "#/components/schemas/ProductReturnPath"
        uiLocales:
          $ref: "#/components/schemas/OAuthUILocales"

    PreparedSignInState:
      type: object
      required:
        - signInRequestID
        - platform
        - state
        - expiresAt
        - entry
      properties:
        signInRequestID:
          $ref: "#/components/schemas/SignInRequestID"
        platform:
          $ref: "#/components/schemas/SignInPlatform"
        state:
          description: Original OAuth state retained for return validation.
          type: string
          minLength: 1
        expiresAt:
          description: |
            Local transaction deadline, at most 20 minutes. Account request and code deadlines still apply
            independently.
          type: string
          minLength: 1
          format: date-time
        entry:
          $ref: "#/components/schemas/AccountAuthorizationEntryDescriptor"
        redirectURI:
          description: Registered business H5 callback, fixed by the backend and on the original page origin.
          type: string
          minLength: 1
          format: uri
      allOf:
        - if:
            properties:
              platform:
                type: string
                enum:
                  - wechat_web_view
            required:
              - platform
          then:
            required:
              - redirectURI
          else:
            not:
              anyOf:
                - required:
                    - redirectURI
        - if:
            properties:
              platform:
                type: string
                enum:
                  - web
            required:
              - platform
          then:
            properties:
              entry:
                properties:
                  facade:
                    type: string
                    enum:
                      - web
          else:
            properties:
              entry:
                properties:
                  facade:
                    type: string
                    enum:
                      - wechat

    PreparedSignInRequest:
      allOf:
        - $ref: "#/components/schemas/PreparedSignInState"
      unevaluatedProperties: false
      examples:
        - signInRequestID: local_sign_in_reference
          platform: web
          state: state_reference
          expiresAt: 2026-11-05T12:20:00Z
          entry:
            facade: web
            entryPurpose: authorize
            url: https://account.xbuilder.com/api/oauth/authorize?client_id=K7mR2qV9sT4wX6yZ8aB0Cg&request_uri=urn%3Aietf%3Aparams%3Aoauth%3Arequest_uri%3Apar_reference&xbuilder_entry_token=EEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEE
            expiresAt: 2026-11-05T12:01:00Z

    CreatedSignInRequest:
      allOf:
        - $ref: "#/components/schemas/PreparedSignInState"
        - type: object
          properties:
            signInToken:
              $ref: "#/components/schemas/AccountOpaqueCredential"
        - if:
            properties:
              platform:
                type: string
                enum:
                  - wechat_mini_program
            required:
              - platform
          then:
            required:
              - signInToken
          else:
            not:
              anyOf:
                - required:
                    - signInToken
      unevaluatedProperties: false
      description: |
        Only native mini program creation returns `signInToken`. Browser and web-view requests use a private product
        cookie instead. No PKCE verifier or Account recovery credential is returned.
      examples:
        - signInRequestID: local_sign_in_reference
          platform: web
          state: state_reference
          expiresAt: 2026-11-05T12:20:00Z
          entry:
            facade: web
            entryPurpose: authorize
            url: https://account.xbuilder.com/api/oauth/authorize?client_id=K7mR2qV9sT4wX6yZ8aB0Cg&request_uri=urn%3Aietf%3Aparams%3Aoauth%3Arequest_uri%3Apar_reference&xbuilder_entry_token=EEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEE
            expiresAt: 2026-11-05T12:01:00Z
        - signInRequestID: local_sign_in_reference
          platform: wechat_mini_program
          state: state_reference
          expiresAt: 2026-11-05T12:20:00Z
          entry:
            facade: wechat
            entryPurpose: authorize
            miniProgramAppID: <main-mini-program-app-id>
            path: pages/account/index?clientID=K7mR2qV9sT4wX6yZ8aB0Cg&requestURI=urn%3Aietf%3Aparams%3Aoauth%3Arequest_uri%3Apar_reference
            extraData:
              entryToken: EEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEE
            expiresAt: 2026-11-05T12:01:00Z
          signInToken: LLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLL
        - signInRequestID: local_sign_in_reference
          platform: wechat_web_view
          state: state_reference
          expiresAt: 2026-11-05T12:20:00Z
          entry:
            facade: wechat
            entryPurpose: authorize
            miniProgramAppID: <main-mini-program-app-id>
            path: pages/account/index?clientID=K7mR2qV9sT4wX6yZ8aB0Cg&requestURI=urn%3Aietf%3Aparams%3Aoauth%3Arequest_uri%3Apar_reference
            extraData:
              entryToken: EEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEE
            expiresAt: 2026-11-05T12:01:00Z
          redirectURI: https://xbuilder.com/account/callback

    CompleteSignInRequest:
      description: |
        Submit a success or error return, or an empty object to recover known local processing state. Neither
        request parameters nor foreground events create a new local flow.
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - code
            - state
          properties:
            code:
              description: Account authorization code from the original return channel.
              type: string
              minLength: 1
            state:
              description: Original OAuth state.
              type: string
              minLength: 1
        - type: object
          additionalProperties: false
          required:
            - error
            - state
          properties:
            error:
              $ref: "#/components/schemas/OAuthError/properties/error"
            state:
              description: Original OAuth state.
              type: string
              minLength: 1
            error_description:
              $ref: "#/components/schemas/OAuthError/properties/error_description"
        - type: object
          additionalProperties: false
          properties: {}

    SignInRequestResult:
      description: Canonical local sign-in state. Recovery never fetches a code using only the Account recovery credential.
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - signInRequestID
            - status
          properties:
            signInRequestID:
              $ref: "#/components/schemas/SignInRequestID"
            status:
              type: string
              enum:
                - pending
        - type: object
          additionalProperties: false
          required:
            - signInRequestID
            - status
            - entry
          properties:
            signInRequestID:
              $ref: "#/components/schemas/SignInRequestID"
            status:
              type: string
              enum:
                - return_required
            entry:
              $ref: "#/components/schemas/AccountAuthorizationEntryDescriptor"
        - type: object
          additionalProperties: false
          required:
            - signInRequestID
            - status
            - clientID
            - token
            - accessTokenExpiresAt
            - returnTo
          properties:
            signInRequestID:
              $ref: "#/components/schemas/SignInRequestID"
            status:
              type: string
              enum:
                - completed
            clientID:
              $ref: "#/components/schemas/OAuthClientID"
            token:
              $ref: "#/components/schemas/OAuthToken"
            accessTokenExpiresAt:
              description: Fixed access token deadline. Recovered `expires_in` reflects only remaining lifetime.
              type: string
              minLength: 1
              format: date-time
            returnTo:
              $ref: "#/components/schemas/ProductReturnPath"
        - type: object
          additionalProperties: false
          required:
            - signInRequestID
            - status
            - oauthError
          properties:
            signInRequestID:
              $ref: "#/components/schemas/SignInRequestID"
            status:
              type: string
              enum:
                - failed
            oauthError:
              $ref: "#/components/schemas/OAuthError"
        - type: object
          additionalProperties: false
          required:
            - signInRequestID
            - status
          properties:
            signInRequestID:
              $ref: "#/components/schemas/SignInRequestID"
            status:
              type: string
              enum:
                - cancelled
        - type: object
          additionalProperties: false
          required:
            - signInRequestID
            - status
          properties:
            signInRequestID:
              $ref: "#/components/schemas/SignInRequestID"
            status:
              type: string
              enum:
                - restart_required
      examples:
        - signInRequestID: local_sign_in_reference
          status: return_required
          entry:
            facade: web
            entryPurpose: return
            url: https://account.xbuilder.com/sign-in?clientID=K7mR2qV9sT4wX6yZ8aB0Cg&requestURI=urn%3Aietf%3Aparams%3Aoauth%3Arequest_uri%3Apar_reference&entryToken=EEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEE
            expiresAt: 2026-11-05T12:01:00Z
        - signInRequestID: local_sign_in_reference
          status: completed
          clientID: K7mR2qV9sT4wX6yZ8aB0Cg
          token:
            access_token: example-access-token
            token_type: Bearer
            expires_in: 300
            refresh_token: example-refresh-token
            scope: account:user:read
          accessTokenExpiresAt: 2026-11-05T12:05:00Z
          returnTo: /projects

    CancelledSignInRequest:
      type: object
      additionalProperties: false
      required:
        - signInRequestID
        - status
      properties:
        signInRequestID:
          $ref: "#/components/schemas/SignInRequestID"
        status:
          type: string
          enum:
            - cancelled

    PreparedAccountFlowToken:
      type: object
      additionalProperties: false
      required:
        - flowToken
        - expiresAt
      properties:
        flowToken:
          $ref: "#/components/schemas/AccountOpaqueCredential"
        expiresAt:
          description: Local retention deadline, 30 minutes after preparation.
          type: string
          minLength: 1
          format: date-time
      examples:
        - flowToken: FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF
          expiresAt: 2026-11-05T12:30:00Z

    User:
      description: User account information.
      type: object
      required:
        - id
        - createdAt
        - updatedAt
        - username
        - displayName
        - avatar
        - description
        - plan
        - followerCount
        - followingCount
        - projectCount
        - publicProjectCount
        - likedProjectCount
      properties:
        id:
          $ref: "#/components/schemas/Model/properties/id"
        createdAt:
          $ref: "#/components/schemas/Model/properties/createdAt"
        updatedAt:
          $ref: "#/components/schemas/Model/properties/updatedAt"
        username:
          description: Unique username of the user.
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[A-Za-z0-9_-]{1,100}$"
          examples:
            - john
        displayName:
          description: Display name of the user.
          type: string
          minLength: 1
          maxLength: 100
          examples:
            - John Doe
        avatar:
          description: Public HTTP URL of the user's avatar image.
          type: string
          format: uri
          pattern: "^https?://"
          examples:
            - https://avatars.example.com/users/10137.png
        description:
          description: Brief bio or description of the user.
          type: string
          maxLength: 200
          examples:
            - Two giants live in Britain's land...
        plan:
          description: Subscription plan of the user.
          type: string
          enum:
            - free
            - plus
          examples:
            - free
        followerCount:
          description: Number of followers the user has.
          type: integer
          format: int64
          minimum: 0
          examples:
            - 1
        followingCount:
          description: Number of users the user is following.
          type: integer
          format: int64
          minimum: 0
          examples:
            - 1
        projectCount:
          description: Total number of projects created by the user.
          type: integer
          format: int64
          minimum: 0
          examples:
            - 1
        publicProjectCount:
          description: Number of public projects created by the user.
          type: integer
          format: int64
          minimum: 0
          examples:
            - 1
        likedProjectCount:
          description: Number of projects liked by the user.
          type: integer
          format: int64
          minimum: 0
          examples:
            - 1
        capabilities:
          description: |
            Capabilities of the user.

            **This field is only present for the authenticated user's own profile.**
          $ref: "#/components/schemas/UserCapabilities"

    AuthenticatedUser:
      description: Authenticated user account information.
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required:
            - capabilities

    UserCapabilities:
      type: object
      description: User permission capabilities.
      required:
        - canManageAccount
        - canManageAuthorization
        - canManageAssets
        - canManageCourses
        - canManageFeedback
        - canUsePremiumLLM
      properties:
        canManageAccount:
          description: Whether the user can manage user accounts.
          type: boolean
          examples:
            - true
        canManageAuthorization:
          description: Whether the user can manage user authorizations.
          type: boolean
          examples:
            - true
        canManageAssets:
          description: Whether the user can manage asset library.
          type: boolean
          examples:
            - true
        canManageCourses:
          description: Whether the user can manage courses and course series.
          type: boolean
          examples:
            - true
        canManageFeedback:
          description: Whether the user can manage feedback.
          type: boolean
          examples:
            - true
        canUsePremiumLLM:
          description: Whether the user can access premium LLM models.
          type: boolean
          examples:
            - true

    NotificationCategory:
      description: Category used to group notifications in the client.
      type: string
      enum:
        - message
        - announcement
      examples:
        - message

    Notification:
      description: Notification delivered to the authenticated user.
      type: object
      required:
        - id
        - category
        - title
        - body
        - createdAt
        - readAt
      properties:
        id:
          $ref: "#/components/schemas/Model/properties/id"
        category:
          $ref: "#/components/schemas/NotificationCategory"
        title:
          description: Title of the notification.
          type: string
          minLength: 1
          maxLength: 200
          examples:
            - New follower
        body:
          description: Body of the notification in Markdown.
          type: string
          minLength: 1
          maxLength: 5000
          examples:
            - "[John Doe](/user/john) started following you."
        createdAt:
          $ref: "#/components/schemas/Model/properties/createdAt"
        readAt:
          description: Time when the user first read the notification, or `null` if the notification is unread.
          type:
            - string
            - "null"
          format: date-time
          examples:
            - 2006-01-02T15:04:05+07:00

    Project:
      type: object
      description: Project information including files, metadata, and statistics.
      required:
        - id
        - createdAt
        - updatedAt
        - owner
        - name
        - type
        - displayName
        - revision
        - files
        - visibility
        - description
        - instructions
        - extraSettings
        - thumbnail
        - viewCount
        - likeCount
        - releaseCount
        - remixCount
      properties:
        id:
          $ref: "#/components/schemas/Model/properties/id"
        createdAt:
          $ref: "#/components/schemas/Model/properties/createdAt"
        updatedAt:
          $ref: "#/components/schemas/Model/properties/updatedAt"
        owner:
          $ref: "#/components/schemas/User/properties/username"
        remixedFrom:
          description: Full name of the project release from which the project is remixed.
          $ref: "#/components/schemas/ProjectReleaseFullName"
        latestRelease:
          description: Latest release of the project.
          $ref: "#/components/schemas/ProjectRelease"
        name:
          description: Unique name of the project.
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[A-Za-z0-9_-]{1,100}$"
          examples:
            - NiuXiaoQi
        type:
          description: Type of the project.
          type: string
          enum:
            - game
          examples:
            - game
        displayName:
          description: Display name of the project.
          type: string
          minLength: 1
          maxLength: 100
          examples:
            - Niu Xiao Qi
        revision:
          description: |
            Monotonically increasing identifier of the project's editable state.

            Changes to editable project content or metadata advance this revision. Creating releases and updating
            activity counters such as views, likes, and remixes do not.
          type: integer
          format: int64
          minimum: 1
          readOnly: true
          examples:
            - 1
        files:
          description: File paths and their corresponding universal URLs associated with the project.
          type: object
          additionalProperties:
            type: string
          examples:
            - NiuXiaoQi.spx: data:;,
              assets/backdrop.jpeg: kodo://xbuilder-usercontent-test/files/FnPtX9heX2eXE8vRIiITmFXQVAOz-5352
              assets/index.json: data:application/json,%7B%22backdrops%22%3A%5B%7B%22x%22%3A0%2C%22y%22%3A0%2C%22faceRight%22%3A0%2C%22bitmapResolution%22%3A2%2C%22name%22%3A%22backdrop%22%2C%22path%22%3A%22backdrop.png%22%2C%22builder_id%22%3A%22LGH5r3l8lDocud3zzlq3D%22%7D%5D%2C%22backdropIndex%22%3A0%2C%22map%22%3A%7B%22width%22%3A480%2C%22height%22%3A360%2C%22mode%22%3A%22fillRatio%22%7D%2C%22run%22%3A%7B%22width%22%3A480%2C%22height%22%3A360%7D%2C%22zorder%22%3A%5B%22NiuXiaoQi%22%5D%2C%22builder_spriteOrder%22%3A%5B%22fZFB5R_Mwwq95FB6xIVYu%22%5D%2C%22builder_soundOrder%22%3A%5B%5D%7D
              assets/sprites/NiuXiaoQi/costume.png: kodo://xbuilder-usercontent-test/files/FoSC8ngQn_jzAIPBqCp9VZLBVkSq-52661
              assets/sprites/NiuXiaoQi/index.json: data:application/json,%7B%22heading%22%3A90%2C%22x%22%3A0%2C%22y%22%3A0%2C%22size%22%3A1%2C%22rotationStyle%22%3A%22normal%22%2C%22costumeIndex%22%3A0%2C%22visible%22%3Atrue%2C%22isDraggable%22%3Afalse%2C%22pivot%22%3A%7B%22x%22%3A71%2C%22y%22%3A-75%7D%2C%22costumes%22%3A%5B%7B%22x%22%3A0%2C%22y%22%3A0%2C%22faceRight%22%3A0%2C%22bitmapResolution%22%3A2%2C%22name%22%3A%22costume%22%2C%22path%22%3A%22costume.png%22%2C%22builder_id%22%3A%22VCxSMAnlb3WI1IyikqjCV%22%7D%5D%2C%22fAnimations%22%3A%7B%7D%2C%22animBindings%22%3A%7B%7D%2C%22builder_id%22%3A%22fZFB5R_Mwwq95FB6xIVYu%22%7D
              main.spx: data:;,
        visibility:
          $ref: "#/components/schemas/Visibility"
        description:
          description: Brief description of the project.
          type: string
          maxLength: 400
          examples:
            - NiuXiaoQi in your area.
        instructions:
          description: Instructions on how to interact with the project.
          type: string
          maxLength: 400
          examples:
            - Just run it.
        extraSettings:
          description: Extra settings of the project.
          type: object
          examples:
            - source: auto
              artStyle: pixel-art
              perspective: side-scrolling
        thumbnail:
          description: Thumbnail reference of the project's thumbnail image.
          type: string
          format: uri-reference
          examples:
            - https://example.com/project-thumbnail.png
        viewCount:
          description: Number of times the project has been viewed.
          type: integer
          format: int64
          minimum: 0
          examples:
            - 1
        likeCount:
          description: Number of likes the project has received.
          type: integer
          format: int64
          minimum: 0
          examples:
            - 1
        releaseCount:
          description: Number of releases associated with the project.
          type: integer
          format: int64
          minimum: 0
          examples:
            - 1
        remixCount:
          description: Number of times the project has been remixed.
          type: integer
          format: int64
          minimum: 0
          examples:
            - 1

    ProjectFullName:
      description: Full name of a project in the format `owner/project`.
      type: string
      minLength: 3
      maxLength: 201
      pattern: "^[A-Za-z0-9_-]{1,100}/[A-Za-z0-9_-]{1,100}$"
      examples:
        - john/NiuXiaoQi

    ProjectRelease:
      description: A versioned release of a project.
      type: object
      required:
        - id
        - createdAt
        - updatedAt
        - projectFullName
        - name
        - description
        - files
        - thumbnail
        - remixCount
      properties:
        id:
          $ref: "#/components/schemas/Model/properties/id"
        createdAt:
          $ref: "#/components/schemas/Model/properties/createdAt"
        updatedAt:
          $ref: "#/components/schemas/Model/properties/updatedAt"
        projectFullName:
          description: Full name of the project that the release is associated with, in the format `owner/project`.
          $ref: "#/components/schemas/ProjectFullName"
        name:
          description: Project release name following [Semantic Versioning 2.0.0](https://semver.org/spec/v2.0.0.html).
          type: string
          maxLength: 255
          pattern: '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'
          examples:
            - v1.2.3
        description:
          description: Brief description of the release.
          type: string
          minLength: 1
          maxLength: 400
          examples:
            - First release.
        files:
          description: File paths and their corresponding universal URLs associated with the release.
          $ref: "#/components/schemas/Project/properties/files"
        thumbnail:
          description: Thumbnail reference of the release.
          $ref: "#/components/schemas/Project/properties/thumbnail"
        remixCount:
          description: Number of times the release has been remixed.
          $ref: "#/components/schemas/Project/properties/remixCount"

    ProjectReleaseFullName:
      description: |
        Full name of a project release in the format `owner/project/release`.

        `maxLength` is derived from 100-character owner and project names, two `/` separators, and a 255-character
        release name.
      type: string
      minLength: 10
      maxLength: 457
      pattern: '^[A-Za-z0-9_-]{1,100}/[A-Za-z0-9_-]{1,100}/v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'
      examples:
        - john/NiuXiaoQi/v1.2.3

    Asset:
      description: Reusable asset such as sprite, backdrop, or sound.
      type: object
      required:
        - id
        - createdAt
        - updatedAt
        - owner
        - displayName
        - type
        - description
        - extraSettings
        - files
        - filesHash
        - visibility
      properties:
        id:
          $ref: "#/components/schemas/Model/properties/id"
        createdAt:
          $ref: "#/components/schemas/Model/properties/createdAt"
        updatedAt:
          $ref: "#/components/schemas/Model/properties/updatedAt"
        owner:
          description: Username of the asset's owner.
          $ref: "#/components/schemas/User/properties/username"
        displayName:
          description: Display name of the asset.
          type: string
          minLength: 1
          maxLength: 100
          examples:
            - NiuXiaoQi
        type:
          description: Type of the asset.
          type: string
          enum:
            - sprite
            - backdrop
            - sound
          examples:
            - sprite
        description:
          description: Brief description of the asset.
          type: string
          examples:
            - A cute character sprite.
        extraSettings:
          description: Extra settings specific to the asset.
          type: object
          examples:
            - artStyle: pixel-art
              perspective: side-scrolling
        files:
          description: File paths and their corresponding universal URLs associated with the asset.
          type: object
          additionalProperties:
            type: string
          examples:
            - assets/sprites/NiuXiaoQi/costume.png: kodo://xbuilder-usercontent-test/files/FoSC8ngQn_jzAIPBqCp9VZLBVkSq-52661
              assets/sprites/NiuXiaoQi/index.json: data:application/json,%7B%22heading%22%3A90%2C%22x%22%3A0%2C%22y%22%3A0%2C%22size%22%3A1%2C%22rotationStyle%22%3A%22normal%22%2C%22costumeIndex%22%3A0%2C%22visible%22%3Atrue%2C%22isDraggable%22%3Afalse%2C%22pivot%22%3A%7B%22x%22%3A71%2C%22y%22%3A-75%7D%2C%22costumes%22%3A%5B%7B%22x%22%3A0%2C%22y%22%3A0%2C%22faceRight%22%3A0%2C%22bitmapResolution%22%3A2%2C%22name%22%3A%22costume%22%2C%22path%22%3A%22costume.png%22%2C%22builder_id%22%3A%22VCxSMAnlb3WI1IyikqjCV%22%7D%5D%2C%22fAnimations%22%3A%7B%7D%2C%22animBindings%22%3A%7B%7D%2C%22builder_id%22%3A%22fZFB5R_Mwwq95FB6xIVYu%22%7D
        filesHash:
          description: Hash of the asset files.
          type: string
          minLength: 1
          examples:
            - h1:qUqP5cyxm6YcTAhz05Hph5gvu9M=
        visibility:
          $ref: "#/components/schemas/Visibility"

    Course:
      description: Educational course with learning content.
      type: object
      required:
        - id
        - createdAt
        - updatedAt
        - owner
        - title
        - thumbnail
        - entrypoint
        - prompt
      properties:
        id:
          $ref: "#/components/schemas/Model/properties/id"
        createdAt:
          $ref: "#/components/schemas/Model/properties/createdAt"
        updatedAt:
          $ref: "#/components/schemas/Model/properties/updatedAt"
        owner:
          description: Username of the course's owner.
          $ref: "#/components/schemas/User/properties/username"
        title:
          description: Title of the course.
          type: string
          minLength: 1
          maxLength: 200
          examples:
            - Introduction to XGo
        thumbnail:
          description: Thumbnail reference of the course.
          type: string
          format: uri-reference
          minLength: 1
          examples:
            - kodo://xbuilder-usercontent-test/files/FvYyHLNrtx8qFHSwnLjEe57UA2fF-2824936
        entrypoint:
          description: Starting entrypoint of the course.
          type: string
          format: uri-reference
          minLength: 1
          examples:
            - /editor/john/loop
        prompt:
          description: Prompt text for the course (used for copilot assistance).
          type: string
          maxLength: 12000
          examples:
            - Learn the basics of XGo programming language

    CourseSeries:
      description: Collection of related courses.
      type: object
      required:
        - id
        - createdAt
        - updatedAt
        - owner
        - title
        - thumbnail
        - description
        - courseIDs
        - order
      properties:
        id:
          $ref: "#/components/schemas/Model/properties/id"
        createdAt:
          $ref: "#/components/schemas/Model/properties/createdAt"
        updatedAt:
          $ref: "#/components/schemas/Model/properties/updatedAt"
        owner:
          description: Username of the course series' owner.
          $ref: "#/components/schemas/User/properties/username"
        title:
          description: Title of the course series.
          type: string
          minLength: 1
          maxLength: 200
          examples:
            - XGo Programming Series
        thumbnail:
          description: Thumbnail reference of the course series.
          type: string
          format: uri-reference
          minLength: 1
          examples:
            - kodo://xbuilder-usercontent-test/files/FvYyHLNrtx8qFHSwnLjEe57UA2fF-2824936
        description:
          description: Description of the course series.
          type: string
          maxLength: 400
          examples:
            - A series of courses on XBuilder programming.
        courseIDs:
          description: Array of course IDs included in this series.
          type: array
          items:
            $ref: "#/components/schemas/Model/properties/id"
          examples:
            - ["1", "2", "3"]
        order:
          description: Order/priority of the course series for sorting.
          type: integer
          format: int32
          examples:
            - 1

    FileObject:
      description: A content-addressed file object stored in Kodo.
      type: object
      required:
        - url
      properties:
        url:
          description: Universal URL of the file object.
          type: string
          format: uri
          pattern: "^kodo://[^/?#@:]+/[^?#]+$"
          examples:
            - kodo://xbuilder-usercontent-test/files/lm4W-B9xRnQqLLX9MP8Yafji4gmr-4194305.ttf

    UpInfo:
      description: Upload credentials and configuration.
      type: object
      required:
        - token
        - expiresAt
        - maxSize
        - bucket
        - region
      properties:
        token:
          description: Upload token used for authenticating upload requests.
          type: string
          examples:
            - MY_ACCESS_KEY:wQ4ofysef1R7IKnrziqtomqyDvI=:eyJzY29wZSI6Im15LWJ1Y2tldDpzdW5mbG93ZXIuanBnIiwiZGVhZGxpbmUiOjE0NTE0OTEyMDAsInJldHVybkJvZHkiOiJ7XCJuYW1lXCI6JChmbmFtZSksXCJzaXplXCI6JChmc2l6ZSksXCJ3XCI6JChpbWFnZUluZm8ud2lkdGgpLFwiaFwiOiQoaW1hZ2VJbmZvLmhlaWdodCksXCJoYXNoXCI6JChldGFnKX0ifQ==
        expiresAt:
          description: Expiration timestamp of the upload token.
          type: string
          format: date-time
          examples:
            - 2006-01-02T15:04:05+07:00
        maxSize:
          description: Maximum allowed file size in bytes.
          type: integer
          format: int64
          examples:
            - 26214400
        bucket:
          description: Name of the Qiniu Kodo bucket where files will be uploaded.
          type: string
          examples:
            - xbuilder-usercontent-test
        region:
          description: Region of the Qiniu Kodo bucket.
          type: string
          examples:
            - z0

    CopilotMessageRequest:
      description: Request payload for copilot message generation endpoints.
      type: object
      required:
        - messages
      properties:
        messages:
          description: |
            Input messages.

            This request shape supports prior assistant `toolCalls` and tool result messages with `toolCallId`.
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/CopilotMessage"
          examples:
            - - role: user
                content:
                  type: text
                  text: Hello, world!
              - role: copilot
                toolCalls:
                  - id: call_1
                    type: function
                    function:
                      name: create_project
                      arguments: '{"name":"My Project"}'
              - role: tool
                toolCallId: call_1
                content:
                  type: text
                  text: '{"id":"project_123"}'
        tools:
          description: Tools available for the copilot to use.
          type: array
          items:
            $ref: "#/components/schemas/CopilotTool"
          examples:
            - - type: function
                function:
                  name: create_project
                  description: Create a new project.
                  parameters:
                    type: object
                    properties:
                      name:
                        type: string
                    required:
                      - name
                    additionalProperties: false

    CopilotMessage:
      description: Message in a copilot conversation.
      oneOf:
        - $ref: "#/components/schemas/CopilotUserMessage"
        - $ref: "#/components/schemas/CopilotCopilotMessage"
        - $ref: "#/components/schemas/CopilotToolMessage"
      discriminator:
        propertyName: role
        mapping:
          user: "#/components/schemas/CopilotUserMessage"
          copilot: "#/components/schemas/CopilotCopilotMessage"
          tool: "#/components/schemas/CopilotToolMessage"

    CopilotMessageContent:
      description: Message content payload.
      type: object
      required:
        - type
        - text
      additionalProperties: false
      properties:
        type:
          description: Type of the message. For now, only `text` is supported.
          type: string
          enum:
            - text
          examples:
            - text
        text:
          description: Text content of the message.
          type: string
          minLength: 1
          maxLength: 40000
          examples:
            - Hello!

    CopilotUserMessage:
      description: User-authored message in a copilot conversation.
      type: object
      required:
        - role
        - content
      additionalProperties: false
      properties:
        role:
          description: Role of the message.
          type: string
          enum:
            - user
          examples:
            - user
        content:
          $ref: "#/components/schemas/CopilotMessageContent"

    CopilotCopilotMessage:
      description: |
        Copilot-authored message in a copilot conversation.

        `content`, `toolCalls`, or both may be present, but at least one of them must be included.
      type: object
      required:
        - role
      additionalProperties: false
      anyOf:
        - title: Text content message
          required:
            - content
        - title: Tool-call message
          required:
            - toolCalls
          properties:
            toolCalls:
              minItems: 1
      properties:
        role:
          description: Role of the message.
          type: string
          enum:
            - copilot
          examples:
            - copilot
        content:
          $ref: "#/components/schemas/CopilotMessageContent"
        toolCalls:
          description: Structured tool calls emitted by the copilot message.
          type: array
          items:
            $ref: "#/components/schemas/CopilotRequestToolCall"

    CopilotToolMessage:
      description: Tool result message in a copilot conversation.
      type: object
      required:
        - role
        - toolCallId
        - content
      additionalProperties: false
      properties:
        role:
          description: Role of the message.
          type: string
          enum:
            - tool
          examples:
            - tool
        toolCallId:
          description: Tool call identifier of the assistant tool call this result corresponds to.
          type: string
          minLength: 1
          examples:
            - call_1
        content:
          $ref: "#/components/schemas/CopilotMessageContent"

    CopilotTool:
      description: Tool available for copilot to use.
      type: object
      required:
        - type
        - function
      properties:
        type:
          description: Type of the tool.
          type: string
          enum:
            - function
          examples:
            - function
        function:
          type: object
          required:
            - name
          properties:
            name:
              description: Name of the function.
              type: string
              maxLength: 64
              pattern: "^[a-zA-Z0-9_-]{1,64}$"
              examples:
                - create_project
            description:
              description: Description of the function.
              type: string
              examples:
                - create project
            parameters:
              description: JSON Schema object that describes the function parameters.
              type: object
              examples:
                - type: object
                  properties:
                    name:
                      type: string
                  required:
                    - name
                  additionalProperties: false

    CopilotRequestToolCall:
      description: Structured tool call supplied on a prior copilot message.
      type: object
      required:
        - id
        - type
        - function
      additionalProperties: false
      properties:
        id:
          description: Unique tool call identifier.
          type: string
          examples:
            - call_1
        type:
          description: Type of the tool call.
          type: string
          enum:
            - function
          examples:
            - function
        function:
          $ref: "#/components/schemas/CopilotRequestToolCallFunction"

    CopilotRequestToolCallFunction:
      description: Function payload of a structured tool call.
      type: object
      required:
        - name
        - arguments
      additionalProperties: false
      properties:
        name:
          description: Name of the function.
          type: string
          examples:
            - create_project
        arguments:
          description: JSON-stringified arguments for the function call.
          type: string
          examples:
            - '{"name":"My Project"}'

    CopilotSSETextDeltaEvent:
      description: Payload of a `text_delta` SSE event from `POST /copilot/messages`.
      type: object
      required:
        - text
      additionalProperties: false
      properties:
        text:
          description: Incremental assistant text fragment. Concatenate fragments in order.
          type: string
          examples:
            - Hello

    CopilotSSEToolCallDeltaEvent:
      description: |
        Payload of a `tool_call_delta` SSE event from `POST /copilot/messages`.

        Merge fragments by `index` to reconstruct one entry in assistant `toolCalls`.
      type: object
      required:
        - index
      additionalProperties: false
      properties:
        index:
          description: Zero-based tool call position within the assistant message's `toolCalls` array.
          type: integer
          format: int64
          minimum: 0
          examples:
            - 0
        id:
          description: Tool call identifier fragment, present when emitted by the provider for this delta.
          type: string
          examples:
            - call_1
        function:
          $ref: "#/components/schemas/CopilotSSEToolCallDeltaFunction"

    CopilotSSEToolCallDeltaFunction:
      description: Incremental function fragment nested inside a `tool_call_delta` event.
      type: object
      additionalProperties: false
      properties:
        name:
          description: Function name fragment, usually emitted once near the start of the tool call.
          type: string
          examples:
            - list_projects
        arguments:
          description: JSON-stringified arguments fragment for the tool call.
          type: string
          examples:
            - '{"query":"demo"}'

    CopilotSSEDoneEvent:
      description: Payload of a terminal `done` SSE event from `POST /copilot/messages`.
      type: object
      required:
        - finishReason
      additionalProperties: false
      properties:
        finishReason:
          description: Provider finish reason for the completed assistant turn.
          type: string
          examples:
            - stop
            - tool_calls

    CopilotSSEErrorEvent:
      description: Payload of a terminal `error` SSE event from `POST /copilot/messages`.
      type: object
      required:
        - reason
        - message
      additionalProperties: false
      properties:
        reason:
          description: Machine-readable error reason for programmatic handling.
          type: string
          examples:
            - streamFailed
        message:
          description: Human-readable streaming error message.
          type: string
          examples:
            - stream failed

    AIInteractionTurn:
      description: Completed turn recorded after the command requested by the AI was executed.
      type: object
      required:
        - responseCommandName
        - executedCommandResult
      additionalProperties: false
      allOf:
        - if:
            required:
              - isInitial
            properties:
              isInitial:
                const: true
          then:
            required:
              - requestContent
            properties:
              requestContent:
                minLength: 1
          else:
            properties:
              requestContent:
                maxLength: 0
              context:
                maxProperties: 0
      properties:
        requestContent:
          description: User's input text for the turn.
          type: string
          maxLength: 280
          examples:
            - It's your turn.
        context:
          description: Context for the user's input text for the turn.
          type: object
          additionalProperties: true
          examples:
            - position: [10, 20]
              health: 80
        responseCommandName:
          $ref: "#/components/schemas/AIInteractionCommandName"
        responseCommandArgs:
          $ref: "#/components/schemas/AIInteractionCommandArguments"
        executedCommandResult:
          $ref: "#/components/schemas/AIInteractionCommandResult"
        isInitial:
          description: Indicates whether this turn is the initial turn of an interaction sequence.
          type: boolean
          examples:
            - true

    AIInteractionCommandName:
      description: Name of an AI command.
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^[A-Za-z0-9_-]+$"
      examples:
        - MakeMove

    AIInteractionCommandParameter:
      description: Parameter or object property accepted by an AI command.
      type: object
      required:
        - name
        - schema
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/AIInteractionCommandParameterName"
        description:
          description: Purpose of the parameter or object property.
          type: string
          maxLength: 1024
          examples:
            - "Direction to move: up, down, left, right"
        schema:
          $ref: "#/components/schemas/AIInteractionCommandValueSchema"

    AIInteractionCommandParameterName:
      description: Name of an AI command parameter or object property.
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^[A-Za-z0-9_-]+$"
      examples:
        - Direction

    AIInteractionCommandValueSchema:
      description: |
        Schema of a value accepted by an AI command.

        A parameter's value schema may contain at most 9 levels, counting its outermost schema as the first level.
      oneOf:
        - type: object
          required:
            - type
          additionalProperties: false
          properties:
            type:
              type: string
              enum:
                - string
                - integer
                - number
                - boolean
              examples:
                - string
        - type: object
          required:
            - type
            - items
          additionalProperties: false
          properties:
            type:
              type: string
              const: array
              examples:
                - array
            items:
              $ref: "#/components/schemas/AIInteractionCommandValueSchema"
            minItems:
              description: Minimum number of items accepted by the array.
              type: integer
              minimum: 0
            maxItems:
              description: |
                Maximum number of items accepted by the array.

                When both are specified, `maxItems` must be greater than or equal to `minItems`.
              type: integer
              minimum: 0
        - type: object
          required:
            - type
          additionalProperties: false
          properties:
            type:
              type: string
              const: object
              examples:
                - object
            properties:
              description: |
                Complete set of properties accepted by the object.

                Every property is required, and property names must be unique within the array.
              type: array
              maxItems: 128
              items:
                $ref: "#/components/schemas/AIInteractionCommandParameter"

    AIInteractionCommandArguments:
      description: Arguments for an AI command.
      type: object
      propertyNames:
        $ref: "#/components/schemas/AIInteractionCommandParameterName"
      additionalProperties: true
      examples:
        - Row: 1
          Col: 1
          Result: ""

    AIInteractionCommandResult:
      description: Result of executing the command requested by the AI.
      type: object
      required:
        - success
      additionalProperties: false
      allOf:
        - if:
            required:
              - success
            properties:
              success:
                const: true
          then:
            not:
              required:
                - errorMessage
        - if:
            required:
              - success
            properties:
              success:
                const: false
          then:
            properties:
              isBreak:
                const: false
      properties:
        success:
          description: Indicates whether the command execution was successful.
          type: boolean
          examples:
            - true
        errorMessage:
          description: Error details if execution failed.
          type: string
          examples:
            - Invalid move parameters
        isBreak:
          description: Indicates whether the current interaction sequence should be terminated.
          type: boolean
          examples:
            - false

    AIGCTask:
      description: AIGC task object.
      type: object
      required:
        - id
        - createdAt
        - updatedAt
        - type
        - status
      properties:
        id:
          $ref: "#/components/schemas/Model/properties/id"
        createdAt:
          $ref: "#/components/schemas/Model/properties/createdAt"
        updatedAt:
          $ref: "#/components/schemas/Model/properties/updatedAt"
        type:
          description: Type of AIGC task.
          type: string
          enum:
            - removeBackground
            - generateCostume
            - generateAnimationVideo
            - extractVideoFrames
            - generateBackdrop
          examples:
            - removeBackground
        status:
          description: Current status of the AIGC task.
          type: string
          enum:
            - pending
            - processing
            - cancelling
            - completed
            - cancelled
            - failed
          examples:
            - processing
        result:
          description: Task result. Only available when status is completed.
          anyOf:
            - title: removeBackground
              type: object
              required:
                - imageUrl
              properties:
                imageUrl:
                  description: Universal URL of the image with background removed (e.g. kodo://bucket/key).
                  type: string
                  format: uri
            - title: generateCostume
              type: object
              required:
                - imageUrls
              properties:
                imageUrls:
                  description: Universal URLs of the generated costume images (e.g. kodo://bucket/key).
                  type: array
                  items:
                    type: string
                    format: uri
            - title: generateAnimationVideo
              type: object
              required:
                - videoUrl
              properties:
                videoUrl:
                  description: Universal URL of the generated animation video (e.g. kodo://bucket/key).
                  type: string
                  format: uri
            - title: extractVideoFrames
              type: object
              required:
                - frameUrls
              properties:
                frameUrls:
                  description: Universal URLs of the extracted frame images (e.g. kodo://bucket/key).
                  type: array
                  items:
                    type: string
                    format: uri
            - title: generateBackdrop
              type: object
              required:
                - imageUrls
              properties:
                imageUrls:
                  description: Universal URLs of the generated backdrop images (e.g. kodo://bucket/key).
                  type: array
                  items:
                    type: string
                    format: uri
        error:
          description: Error details. Only available when status is failed.
          type: object
          required:
            - reason
            - message
          properties:
            reason:
              description: Machine-readable error reason for programmatic handling.
              type: string
              enum:
                - invalidInput
                - contentPolicyViolation
                - generationFailed
                - timeout
                - serviceUnavailable
                - internalError
              examples:
                - contentPolicyViolation
            message:
              description: Human-readable error message.
              type: string
              examples:
                - Generation failed due to content policy violation

    InputText:
      description: Text input for multimodal content.
      type: object
      required:
        - type
        - text
      additionalProperties: false
      properties:
        type:
          description: Content type identifier.
          type: string
          enum:
            - inputText
          examples:
            - inputText
        text:
          description: The text content.
          type: string
          minLength: 1
          maxLength: 2000
          examples:
            - "Generate a description for a sprite named 'Tornado'."

    InputImage:
      description: Image input for multimodal content.
      type: object
      required:
        - type
        - imageUrl
      additionalProperties: false
      properties:
        type:
          description: Content type identifier.
          type: string
          enum:
            - inputImage
          examples:
            - inputImage
        imageUrl:
          description: |
            Base64-encoded PNG image data URL.

            Data URL requirements:

            - The format must be `data:image/png;base64,<base64_data>`.
            - The maximum image size is 5 MiB after decoding the base64 content.
            - Other formats such as SVG, JPEG, or WebP must be converted to PNG before sending.
          type: string
          format: uri
          minLength: 1
          maxLength: 7000000
          examples:
            - "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=="

    AIGCArtStyle:
      description: Art style of projects or assets.
      type: string
      enum:
        - pixel-art
        - flat-design
        - hand-drawn
        - low-poly
        - ghibli
        - unspecified
      examples:
        - pixel-art

    AIGCPerspective:
      description: Viewing perspectives for projects or assets.
      type: string
      enum:
        - angled-top-down
        - side-scrolling
        - unspecified
      examples:
        - side-scrolling

    AIGCProjectSettings:
      description: Settings of project for assets generation.
      type: object
      properties:
        name:
          description: Name of the project.
          type: string
          maxLength: 100
          examples:
            - My First Project
        description:
          description: Description of the project.
          type: string
          examples:
            - A simple project.
        artStyle:
          $ref: "#/components/schemas/AIGCArtStyle"
        perspective:
          $ref: "#/components/schemas/AIGCPerspective"

    AIGCAssetBaseSettings:
      description: Base settings shared by all asset types.
      type: object
      properties:
        name:
          description: Name of the asset.
          type: string
          maxLength: 100
          examples:
            - Fire Demon
        description:
          description: Description of the asset.
          type: string
          examples:
            - A fire demon character with glowing ember cracks

    AIGCGraphicAssetSettings:
      description: Settings for graphic assets, extending base settings with graphic properties.
      allOf:
        - $ref: "#/components/schemas/AIGCAssetBaseSettings"
        - type: object
          properties:
            artStyle:
              $ref: "#/components/schemas/AIGCArtStyle"
            perspective:
              $ref: "#/components/schemas/AIGCPerspective"

    AIGCSpriteSettings:
      description: Settings for generating a sprite asset.
      allOf:
        - $ref: "#/components/schemas/AIGCGraphicAssetSettings"
        - type: object
          properties:
            category:
              description: Sprite category.
              type: string
              enum:
                - character
                - item
                - effect
                - ui
                - unspecified

    AIGCCostumeSettings:
      description: Settings for generating a costume asset.
      allOf:
        - $ref: "#/components/schemas/AIGCGraphicAssetSettings"
        - type: object
          properties:
            referenceImageUrl:
              description: Universal URL of the costume reference image (e.g. kodo://bucket/key).
              type:
                - string
                - "null"
              format: uri
            facing:
              description: Direction the costume is facing.
              type: string
              enum:
                - front
                - back
                - left
                - right
                - unspecified

    AIGCAnimationSettings:
      description: Settings for generating an animation asset.
      allOf:
        - $ref: "#/components/schemas/AIGCGraphicAssetSettings"
        - type: object
          required:
            - loopMode
          properties:
            referenceFrameUrl:
              description: Universal URL of the animation reference frame image (e.g. kodo://bucket/key).
              type:
                - string
                - "null"
              format: uri
            loopMode:
              description: Whether the animation is loopable or non-loopable.
              type: string
              enum:
                - loopable
                - non-loopable

    AIGCBackdropSettings:
      description: Settings for generating a backdrop asset.
      allOf:
        - $ref: "#/components/schemas/AIGCGraphicAssetSettings"
        - type: object
          properties:
            referenceImageUrl:
              description: Universal URL of the backdrop reference image.
              type:
                - string
                - "null"
              format: uri
              examples:
                - kodo://bucket/key
            category:
              description: Backdrop category.
              type: string
              enum:
                - ui
                - unspecified

    Feedback:
      description: Problem report submitted by a user.
      type: object
      required:
        - id
        - createdAt
        - updatedAt
        - owner
        - title
        - description
        - status
      properties:
        id:
          $ref: "#/components/schemas/Model/properties/id"
        createdAt:
          $ref: "#/components/schemas/Model/properties/createdAt"
        updatedAt:
          $ref: "#/components/schemas/Model/properties/updatedAt"
        owner:
          description: Username of the user who submitted the feedback.
          $ref: "#/components/schemas/User/properties/username"
        title:
          description: Summary of the problem.
          type: string
          minLength: 1
          maxLength: 100
          pattern: "\\S"
          examples:
            - Sprite stops moving after renaming
        description:
          description: Details about the problem.
          type: string
          minLength: 1
          maxLength: 2000
          pattern: "\\S"
          examples:
            - After I renamed the sprite, pressing the arrow keys no longer moves it.
        context:
          description: |
            Diagnostic information the user chose to share, captured when the feedback was submitted.

            Its structure is defined by the client. Omitted if the user did not share it.
          type: object
          additionalProperties: true
          examples:
            - source: profileMenu
              page:
                path: /editor/alice/game
                language: en
              project:
                identifier: alice/game
                displayName: Game
        status:
          description: |
            Processing status of the feedback.

            - `new`: Awaiting administrator processing.
            - `handled`: Marked as handled by an administrator.
          type: string
          enum:
            - new
            - handled
          examples:
            - new

    UserAuthorization:
      type: object
      description: XBuilder Authorization inputs and derived capabilities for a user.
      required:
        - userID
        - roles
        - plan
        - capabilities
      properties:
        userID:
          description: ID of the user.
          $ref: "#/components/schemas/Model/properties/id"
        roles:
          description: Roles assigned to the user. The `authorizationAdmin` role requires the `accountAdmin` role.
          type: array
          items:
            type: string
            minLength: 1
          examples:
            - - assetAdmin
              - courseAdmin
        plan:
          $ref: "#/components/schemas/User/properties/plan"
        capabilities:
          $ref: "#/components/schemas/UserCapabilities"
        quotaPolicies:
          description: Derived quota policies for XBuilder Authorization decisions.
          type: object
          additionalProperties: true

    AuditLog:
      type: object
      description: Admin audit log entry.
      required:
        - id
        - createdAt
        - action
        - resourceType
        - resourceID
      properties:
        id:
          $ref: "#/components/schemas/Model/properties/id"
        createdAt:
          $ref: "#/components/schemas/Model/properties/createdAt"
        action:
          description: Audit action name.
          type: string
          minLength: 1
          examples:
            - account.user.password.set
        actor:
          description: Username of the user who performed the action at the time of the audit event.
          oneOf:
            - $ref: "#/components/schemas/User/properties/username"
            - type: "null"
        resourceType:
          description: Type of the audited resource.
          type: string
          minLength: 1
          examples:
            - account.user
        resourceID:
          description: ID of the audited resource.
          $ref: "#/components/schemas/Model/properties/id"
        metadata:
          description: |
            Additional audit metadata.

            Metadata must not contain passwords, tokens, client secrets, or other secrets.
          type: object
          additionalProperties: true

  parameters:
    SortOrder:
      name: sortOrder
      description: Order in which to sort the results.
      in: query
      schema:
        type: string
        enum:
          - asc
          - desc
        default: asc
        examples:
          - asc

    PageIndex:
      name: pageIndex
      description: Index of the page to retrieve.
      in: query
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
        examples:
          - 1

    PageToken:
      name: pageToken
      description: The `nextPageToken` of the previous page. Omit to retrieve the first page.
      in: query
      schema:
        type: string
        minLength: 1

    PageSize:
      name: pageSize
      description: Number of items per page.
      in: query
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
        examples:
          - 20
