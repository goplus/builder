  /sign-in-requests:
    post:
      operationId: createSignInRequest
      tags:
        - Sign-in
      summary: Prepare an XBuilder product sign-in request
      description: |
        Create a local product sign-in transaction and Account PAR using the server-configured OAuth client, scope,
        callback, and platform target. The caller cannot choose another app or client. Validate and fix `returnTo`
        as a product-internal path. Web and `wechat_web_view` use a private product flow cookie and trusted
        `Origin`. Native mini programs receive `signInToken`. Keep the PKCE verifier and Account recovery credential
        in the backend. H5 hosts receive only public correlation and Account entry information, never these
        credentials or the product flow cookie. Local records last at most 20 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSignInRequest"
            examples:
              web:
                value:
                  platform: web
                  returnTo: /
              miniProgram:
                value:
                  platform: wechat_mini_program
                  returnTo: /projects
                  uiLocales: zh-CN en
              webView:
                value:
                  platform: wechat_web_view
                  returnTo: /projects
      responses:
        "201":
          description: Local sign-in request and Account entry prepared.
          headers:
            Cache-Control:
              $ref: "#/components/headers/AccountNoStore"
            Set-Cookie:
              $ref: "#/components/headers/SignInFlowSetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedSignInRequest"
        "400":
          $ref: "#/components/responses/AccountFlowBadRequest"
        "403":
          $ref: "#/components/responses/AccountFlowForbidden"
        "429":
          $ref: "#/components/responses/AccountFlowTooManyRequests"
        "500":
          $ref: "#/components/responses/AccountFlowInternalServerError"

  /sign-in-requests/{requestID}/entry:
    post:
      operationId: prepareSignInRequestEntry
      tags:
        - Sign-in
      summary: Prepare the original product sign-in entry again
      description: |
        Validate the original local flow credential and use the saved Account recovery credential to prepare a
        still-valid entry. Return authorize for pending authorization or return for an issued available code. A Web
        return opens Account Web directly. The original facade still delivers the authorization code through its
        registered callback or mini program relationship. This endpoint never retrieves a code or discloses backend
        credentials. H5 keeps the configured same-origin callback and original host association.
      security:
        - signInFlowCookie: []
        - signInFlowToken: []
      parameters:
        - name: requestID
          in: path
          required: true
          description: Local product sign-in request reference.
          schema:
            $ref: "#/components/schemas/SignInRequestID"
      responses:
        "200":
          description: Successful response.
          headers:
            Cache-Control:
              $ref: "#/components/headers/AccountNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreparedSignInRequest"
        "400":
          $ref: "#/components/responses/AccountFlowBadRequest"
        "401":
          $ref: "#/components/responses/AccountFlowUnauthorized"
        "403":
          $ref: "#/components/responses/AccountFlowForbidden"
        "404":
          $ref: "#/components/responses/AccountFlowNotFound"
        "409":
          $ref: "#/components/responses/AccountFlowConflict"
        "410":
          $ref: "#/components/responses/AccountFlowExpired"
        "429":
          $ref: "#/components/responses/AccountFlowTooManyRequests"
        "500":
          $ref: "#/components/responses/AccountFlowInternalServerError"

  /sign-in-requests/{requestID}/complete:
    post:
      operationId: completeSignInRequest
      tags:
        - Sign-in
      summary: Complete or recover the known product sign-in request
      description: |
        Validate the original local flow credential and OAuth state before accepting a success or error return.
        Accept only the same return for a request and exchange a validated success code at most once, using a
        15-second timeout and a 30-second completion deadline. An empty JSON object queries Account state without
        retrieving a code. An available issued code returns return_required so the user reopens the original facade.
        Keep successful token results private for at most 5 minutes and deliver them only to the original local flow
        holder. Recovered `expires_in` uses the fixed `accessTokenExpiresAt`. Unknown exchange outcomes never replay
        a code and require restart after the deadline. A cancelled local request never signs the user in from a late
        response.
      security:
        - signInFlowCookie: []
        - signInFlowToken: []
      parameters:
        - name: requestID
          in: path
          required: true
          description: Local product sign-in request reference.
          schema:
            $ref: "#/components/schemas/SignInRequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteSignInRequest"
            examples:
              callback:
                value:
                  code: account-authorization-code
                  state: state_reference
              denied:
                value:
                  error: access_denied
                  state: state_reference
              recovery:
                value: {}
      responses:
        "200":
          description: Successful response.
          headers:
            Cache-Control:
              $ref: "#/components/headers/AccountNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInRequestResult"
        "400":
          $ref: "#/components/responses/AccountFlowBadRequest"
        "401":
          $ref: "#/components/responses/AccountFlowUnauthorized"
        "403":
          $ref: "#/components/responses/AccountFlowForbidden"
        "404":
          $ref: "#/components/responses/AccountFlowNotFound"
        "409":
          $ref: "#/components/responses/AccountFlowConflict"
        "429":
          $ref: "#/components/responses/AccountFlowTooManyRequests"
        "500":
          $ref: "#/components/responses/AccountFlowInternalServerError"

  /sign-in-requests/{requestID}/cancel:
    post:
      operationId: cancelSignInRequest
      tags:
        - Sign-in
      summary: Cancel the local product sign-in attempt
      description: |
        Close the known local attempt, cancel Account authorization if it is still unfinished, and stop accepting
        late completion results. Repeating cancellation returns cancelled. Revoke known tokens produced for the
        cancelled attempt that have not been delivered. This operation does not revoke the facade Account session or
        another product sign-in. Web and H5 requests validate the trusted product `Origin`.
      security:
        - signInFlowCookie: []
        - signInFlowToken: []
      parameters:
        - name: requestID
          in: path
          required: true
          description: Local product sign-in request reference.
          schema:
            $ref: "#/components/schemas/SignInRequestID"
      responses:
        "200":
          description: Successful response.
          headers:
            Cache-Control:
              $ref: "#/components/headers/AccountNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelledSignInRequest"
        "400":
          $ref: "#/components/responses/AccountFlowBadRequest"
        "401":
          $ref: "#/components/responses/AccountFlowUnauthorized"
        "403":
          $ref: "#/components/responses/AccountFlowForbidden"
        "404":
          $ref: "#/components/responses/AccountFlowNotFound"
        "429":
          $ref: "#/components/responses/AccountFlowTooManyRequests"
        "500":
          $ref: "#/components/responses/AccountFlowInternalServerError"

