              type: array
              items:
                type: string
                enum:
                  - create_user
                  - link_identity
              minItems: 1
              uniqueItems: true
            profile:
              $ref: "#/components/schemas/AccountUserCreationCandidate"
            accountProofOptions:
              type: array
              items:
                $ref: "#/components/schemas/AccountAuthenticationOption"
