openapi: 3.1.0
info:
  title: XBuilder API
  version: 0.1.0
  description: |
    ## Overview

    **The API endpoints documented here are not yet stable and may change or break without notice. Use them at your own
    risk.**

    ## Pagination

    List endpoints that support jumping to a page take `pageIndex` and `pageSize` and return `ByPage`. Those that only
    move to the next page take `pageToken` and `pageSize` and return `ByPageToken`. When passing `pageToken`, keep all
    other query parameters except `pageSize` unchanged; otherwise the server responds with `400`.

    ## Error responses

    Most non-OAuth JSON endpoints return the shared `APIError` body for non-2xx responses:

    ```json
    {
      "code": 40001,
      "msg": "Invalid args"
    }
    ```

    The first three digits of `code` match the HTTP status code. Clients should branch on `code` and HTTP status.

    The `msg` field is a developer-facing diagnostic string and is not a stable programmatic contract. It may contain
    safe validation details, but it must not contain stack traces, internal exception text, credentials, or other
    sensitive implementation details.

    Backend implementations should use the codes defined by `ErrorCode` and should add a new documented code before
    exposing a new machine-readable error condition.

    OAuth protocol error responses use the `OAuthError` body instead of `APIError`.

    Moved-resource redirects return `301` with `Location` for `GET` and `HEAD`, while moved-resource write requests
    return `409` with `MovedResourceError`.

    Server-Sent Events endpoints may emit a stream-level `error` event after the HTTP response has already started.

security:
  - bearerAuth: []

paths:
  /account/identity-providers/{provider}/callback:
    get:
      operationId: handleAccountIdentityProviderCallback
      tags:
        - Account
      summary: Verify an identity provider callback
      description: |
        Match state to the fixed provider, application, callback, PKCE, nonce, and authentication request. Before
        consuming state or verifying a code, require the browser flow cookie bound to the initiating PAR for direct
        authentication or to the helping request for assistance. Forwarding a provider authorization address is
        insufficient. Supply exactly one of code and error. Persist verified identity or a safe failure state
        without resolving accounts or changing an Account session. User denial becomes cancelled. Other provider
        failures become failed. Repeated callbacks in the same bound context return to the same fixed Account page
        using stored state without verifying the code again or changing terminal results.
      security:
        - accountFlowCookie: []
      parameters:
        - name: provider
          in: path
          required: true
          description: Provider fixed by the authentication request.
          schema:
            $ref: "#/components/schemas/AccountProviderName"
        - name: state
          in: query
          required: true
          description: One-time provider callback state.
          schema:
            type: string
            minLength: 1
        - name: code
          in: query
          description: Provider authorization code. Mutually exclusive with error.
          schema:
            type: string
            minLength: 1
        - name: error
          in: query
          description: Provider error. Mutually exclusive with code.
          schema:
            type: string
            minLength: 1
      responses:
        "302":
          description: |
            Verification state saved. Return to the fixed Account page to read status using the original flow context.
            No Account session cookie is created or repaired.
          headers:
            Cache-Control:
              $ref: "#/components/headers/AccountNoStore"
            Referrer-Policy:
              $ref: "#/components/headers/AccountNoReferrer"
            Location:
              description: |
                Fixed Account Web /sign-in or /authenticate page with the original public request reference. Never an
                arbitrary caller-provided URL or a URL containing provider errors or credentials.
              schema:
                type: string
                minLength: 1
                format: uri
        "400":
          $ref: "#/components/responses/AccountFlowBadRequest"
        "401":
          $ref: "#/components/responses/AccountFlowUnauthorized"
        "403":
          $ref: "#/components/responses/AccountFlowForbidden"
        "404":
          $ref: "#/components/responses/AccountFlowNotFound"
        "409":
          $ref: "#/components/responses/AccountFlowConflict"
        "410":
          $ref: "#/components/responses/AccountFlowExpired"
        "429":
          $ref: "#/components/responses/AccountFlowTooManyRequests"
        "500":
          $ref: "#/components/responses/AccountFlowInternalServerError"
    post:
      operationId: submitAccountIdentityProviderCallback
      tags:
        - Account
      summary: Process an Apple form-post callback through a same-origin relay
      description: |
        The first cross-site Apple `form_post` may omit the Lax flow cookie. It returns an escaped same-origin HTML
        form without consuming state or verifying credentials. The form preserves code, state, or error and posts to
        the configured same-origin callback. The second submission requires the trusted Account Web `Origin` and
        bound flow cookie before consuming state and verifying credentials, then returns 303 to the fixed Account
        page. Neither phase reads or modifies an Account session. Raw codes remain only in the temporary form and
        are not persisted. A repeated bound submission returns to the same Account page without replaying
        verification or overwriting terminal results.
      security:
        - accountFlowCookie: []
        - {}
      parameters:
        - name: provider
          in: path
          required: true
          description: Provider fixed by the authentication request.
          schema:
            type: string
            enum:
              - apple
        - name: Origin
          in: header
          description: Required for the second, same-origin Apple relay submission. Must be the configured Account Web origin.
          schema:
            type: string
            minLength: 1
            format: uri
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - state
              properties:
                code:
                  description: Provider authorization code.
                  type: string
                  minLength: 1
                state:
                  description: One-time provider callback state.
                  type: string
                  minLength: 1
                error:
                  description: Provider error code, never reflected verbatim in a return URL.
                  type: string
                  minLength: 1
                error_description:
                  description: Optional provider diagnostics, not a public error contract.
                  type: string
                  minLength: 1
              oneOf:
                - required:
                    - code
                  not:
                    anyOf:
                      - required:
                          - error
                - required:
                    - error
                  not:
                    anyOf:
                      - required:
                          - code
      responses:
        "200":
          description: |
            Escaped same-origin relay form for the initial external Apple POST. No credentials have been consumed or
            verified.
          headers:
            Cache-Control:
              $ref: "#/components/headers/AccountNoStore"
            Referrer-Policy:
              description: Preserve the `Origin` header on the relay form submission without sending callback path or query data.
              schema:
                type: string
                enum:
                  - origin
            Content-Security-Policy:
              description: Allow only nonce-protected relay scripts and same-origin forms. Forbid framing.
              schema:
                type: string
                examples:
                  - default-src 'none'; script-src 'nonce-example'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'
            X-Frame-Options:
              schema:
                type: string
                enum:
                  - DENY
          content:
            text/html:
              schema:
                type: string
        "303":
          description: |
            Verification state saved. Return to the fixed Account page to read status using the original flow context.
            No Account session cookie is created or repaired.
          headers:
            Cache-Control:
              $ref: "#/components/headers/AccountNoStore"
            Referrer-Policy:
              $ref: "#/components/headers/AccountNoReferrer"
            Location:
              description: |
                Fixed Account Web /sign-in or /authenticate page with the original public request reference. Never an
                arbitrary caller-provided URL or a URL containing provider errors or credentials.
              schema:
                type: string
                minLength: 1
                format: uri
        "400":
          $ref: "#/components/responses/AccountFlowBadRequest"
        "401":
          $ref: "#/components/responses/AccountFlowUnauthorized"
        "403":
          $ref: "#/components/responses/AccountFlowForbidden"
        "404":
          $ref: "#/components/responses/AccountFlowNotFound"
        "409":
          $ref: "#/components/responses/AccountFlowConflict"
        "410":
          $ref: "#/components/responses/AccountFlowExpired"
        "429":
          $ref: "#/components/responses/AccountFlowTooManyRequests"
        "500":
          $ref: "#/components/responses/AccountFlowInternalServerError"

  /account/user:
    get:
      operationId: getAccountUser
      tags:
        - Account
      summary: Get the current account user
      description: |
        Retrieve user fields exposed by XBuilder Account for the current user.

        Account Web may authenticate with an account session cookie.

        App backends may authenticate with a delegated user access token with the `account:user:read` Account API scope.
        App-only access tokens cannot identify the current user.
      security:
        - accountSessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountUser"
        "401":
          $ref: "#/components/responses/AccountUnauthorized"
        "403":
          $ref: "#/components/responses/OAuthInsufficientScope"
    patch:
      operationId: updateAccountUser
      tags:
        - Account
      summary: Update the current account user
      description: |
        Update writable user fields managed by XBuilder Account for the current user.

        Account Web may authenticate with an account session cookie.

        App backends may authenticate with a delegated user access token with the `account:user:write` Account API
        scope. App-only access tokens cannot identify the current user.

        Cookie-authenticated mutations must validate Origin or use equivalent CSRF protection.
      security:
        - accountSessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                displayName:
                  $ref: "#/components/schemas/AccountUser/properties/displayName"
      responses:
        "200":
          description: Account user updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AccountUnauthorized"
        "403":
          $ref: "#/components/responses/AccountForbidden"

  /account/user/avatar:
    put:
      operationId: updateAccountUserAvatar
      tags:
        - Account
      summary: Update the current account user avatar
      description: |
        Upload and replace the avatar image managed by XBuilder Account for the current user.

        Account Web may authenticate with an account session cookie.

        App backends may authenticate with a delegated user access token with the `account:user:write` Account API
        scope. App-only access tokens cannot identify the current user.

        Cookie-authenticated mutations must validate Origin or use equivalent CSRF protection.
      security:
        - accountSessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  description: |
                    Avatar image file.

                    Avatar requirements:

                    - The image format must be PNG (`image/png`) or JPEG (`image/jpeg`).
                    - The maximum file size is 5 MiB.

                    Uploaded avatars are normalized to a 512x512 PNG. Upload a square image for best visual quality.
                  type: string
                  format: binary
            encoding:
              file:
                contentType: image/png, image/jpeg
      responses:
        "204":
          description: Account user avatar updated.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AccountUnauthorized"
        "403":
          $ref: "#/components/responses/AccountForbidden"
        "413":
          $ref: "#/components/responses/ContentTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /account/user/identities:
    get:
      operationId: listAccountUserIdentities
      tags:
        - Account
      summary: List current account user identities
      description: Retrieve a list of third-party identities linked to the current user.
      security:
        - accountSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PageIndex"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - total
                  - data
                properties:
                  total:
                    $ref: "#/components/schemas/ByPage/properties/total"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AccountUserIdentity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /account/users/{userID}:
    get:
      operationId: getAccountUserByID
      tags:
        - Account
      summary: Get an account user by ID
      description: |
        Retrieve user fields exposed by XBuilder Account for the specified user. The response uses the same
        `AccountUser` representation as `GET /account/user`.

        Requires an app-only access token with the `account:user:read` Account API scope. User access tokens and account
        session cookies are not accepted.

        App directory queries and user queries by ID share a rate limit per OAuth client.
      security:
        - bearerAuth: []
      parameters:
        - name: userID
          description: ID of the user to retrieve.
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Model/properties/id"
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OAuthInsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /account/session:
    get:
      operationId: getAccountSession
      tags:
        - Account
      summary: Get the current facade Account session
      description: |
        Read the current Account session and user. Web uses only its Account session cookie and requires facade=web.
        WeChat uses only an Account session Bearer and requires facade=wechat. Supplying both session channels
        returns 400. This endpoint does not accept product OAuth tokens as Account session credentials. The returned
        session belongs only to its facade.
      security:
        - accountSessionCookie: []
        - accountSessionBearer: []
      responses:
        "200":
          description: Successful response.
          headers:
            Cache-Control:
              $ref: "#/components/headers/AccountNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAccountSession"
        "400":
          $ref: "#/components/responses/AccountFlowBadRequest"
        "401":
          $ref: "#/components/responses/AccountFlowUnauthorized"
        "403":
          $ref: "#/components/responses/AccountFlowForbidden"
        "429":
          $ref: "#/components/responses/AccountFlowTooManyRequests"
        "500":
          $ref: "#/components/responses/AccountFlowInternalServerError"
    delete:
      operationId: revokeAccountSession
      tags:
        - Account
      summary: Revoke the current facade Account session
      description: |
        Revoke only the current session for its facade. Web clears its session cookie and validates the trusted
        `Origin`. WeChat uses its Account session Bearer. Both session channels in one request return 400. This
        operation does not revoke existing product tokens or previously issued authorization codes by default.
      security:
        - accountSessionCookie: []
        - accountSessionBearer: []
      responses:
        "204":
          description: Current Account session revoked.
          headers:
            Cache-Control:
              $ref: "#/components/headers/AccountNoStore"
            Set-Cookie:
              description: Clear the Account session cookie for Web. No cookie is changed for WeChat.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/AccountFlowBadRequest"
        "401":
          $ref: "#/components/responses/AccountFlowUnauthorized"
        "403":
          $ref: "#/components/responses/AccountFlowForbidden"
        "429":
          $ref: "#/components/responses/AccountFlowTooManyRequests"
        "500":
          $ref: "#/components/responses/AccountFlowInternalServerError"

  /account/sessions:
    get:
      operationId: listAccountSessions
      tags:
        - Account
      summary: List current account sessions
      description: Retrieve a list of account sessions of the current user.
      security:
        - accountSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PageIndex"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - total
                  - data
                properties:
                  total:
                    $ref: "#/components/schemas/ByPage/properties/total"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AccountSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: revokeAccountSessions
      tags:
        - Account
      summary: Revoke all current account sessions
      description: |
        Revoke all account sessions of the current user.

        Cookie-authenticated mutations must validate Origin or use equivalent CSRF protection.
      security:
        - accountSessionCookie: []
      responses:
        "204":
          description: Account sessions revoked.
          headers:
            Set-Cookie:
              description: Clears the `__Host-xbuilder-account-session` cookie.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /account/sessions/{sessionID}:
    delete:
      operationId: revokeAccountSessionByID
      tags:
        - Account
      summary: Revoke an account session of the current user
      description: |
        Revoke an account session owned by the current user.

        Cookie-authenticated mutations must validate Origin or use equivalent CSRF protection.
      security:
        - accountSessionCookie: []
      parameters:
        - name: sessionID
          description: ID of the account session to revoke.
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Model/properties/id"
      responses:
        "204":
          description: Account session revoked.
          headers:
            Set-Cookie:
              description: Clears the `__Host-xbuilder-account-session` cookie when the revoked session is current.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /account/apps:
    get:
      operationId: listAccountApps
      tags:
        - Account
      summary: List account apps
      description: |
        Retrieve a list of registered account apps, including disabled apps.

        Requires an app-only access token with the `account:app:read` Account API scope. User access tokens and account
        session cookies are not accepted.

        App directory queries and user queries by ID share a rate limit per OAuth client.
      security:
        - bearerAuth: []
      parameters:
        - name: orderBy
          description: Field by which to order the results.
          in: query
          schema:
            type: string
            enum:
              - createdAt
              - updatedAt
            default: createdAt
            examples:
              - createdAt
        - $ref: "#/components/parameters/SortOrder"
        - $ref: "#/components/parameters/PageIndex"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - total
                  - data
                properties:
                  total:
                    $ref: "#/components/schemas/ByPage/properties/total"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AccountApp"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OAuthInsufficientScope"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /account/apps/{appID}:
    get:
      operationId: getAccountApp
      tags:
        - Account
      summary: Get an account app
      description: |
        Retrieve the registration details of an account app, including a disabled app.

        Requires an app-only access token with the `account:app:read` Account API scope. User access tokens and account
        session cookies are not accepted.

        App directory queries and user queries by ID share a rate limit per OAuth client.
      security:
        - bearerAuth: []
      parameters:
        - name: appID
          description: ID of the app.
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Model/properties/id"
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountApp"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/OAuthInsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /account/oauth/par:
    post:
      operationId: createAccountOAuthPushedAuthorizationRequest
      tags:
        - Account OAuth
      summary: Create a pushed authorization request
      description: |
        Create a single-authorization PAR for the registered OAuth client. Bind client, validated redirect URI,
        scope, state, and PKCE S256. Web may use approved HTTPS preview callback rules. WeChat requires an exact
        registered callback and calling mini program pair. Third-party credentials are not accepted. The backend
        chooses web by default, or wechat when explicitly requested. The opaque `request_uri` is not a
        dereferenceable URL and grants no access to results. Return independent backend recovery and one-time entry
        credentials. The integrating app backend retains the recovery credential and PKCE verifier, forwarding only
        public correlation and entry information to its frontend.
      security:
        - oauthClientSecretBasic: []
        - {}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              allOf:
                - if:
                    properties:
                      xbuilder_facade:
                        type: string
                        enum:
                          - wechat
                    required:
                      - xbuilder_facade
                  then:
                    required:
                      - xbuilder_wechat_mini_program_appid
                  else:
                    not:
                      anyOf:
                        - required:
                            - xbuilder_wechat_mini_program_appid
              required:
                - response_type
                - client_id
                - redirect_uri
                - state
                - code_challenge
                - code_challenge_method
                - scope
              properties:
                response_type:
                  description: OAuth response type.
                  type: string
                  enum:
                    - code
                client_id:
                  description: OAuth client ID of the app.
                  $ref: "#/components/schemas/OAuthClientID"
                redirect_uri:
                  description: Redirect URI requested by the app.
                  type: string
                  format: uri
                state:
                  description: OAuth state value.
                  type: string
                  minLength: 1
                code_challenge:
                  $ref: "#/components/schemas/OAuthPKCECodeChallenge"
                code_challenge_method:
                  description: PKCE code challenge method.
                  type: string
                  enum:
                    - S256
                scope:
                  description: OAuth scope requested by the app.
                  allOf:
                    - $ref: "#/components/schemas/OAuthScope"
                ui_locales:
                  $ref: "#/components/schemas/OAuthUILocales"
                xbuilder_facade:
                  $ref: "#/components/schemas/AccountFacade"
                  default: web
                xbuilder_wechat_mini_program_appid:
                  $ref: "#/components/schemas/AccountWechatMiniProgramAppID"
              additionalProperties: false
            examples:
              web:
                value:
                  response_type: code
                  client_id: K7mR2qV9sT4wX6yZ8aB0Cg
                  redirect_uri: https://xbuilder.com/account/callback
                  state: state_reference
                  code_challenge: CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC
                  code_challenge_method: S256
                  scope: account:user:read
              wechat:
                value:
                  response_type: code
                  client_id: K7mR2qV9sT4wX6yZ8aB0Cg
                  redirect_uri: https://xatom.example.com/account/callback
                  state: state_reference
                  code_challenge: CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC
                  code_challenge_method: S256
                  scope: account:user:read
                  xbuilder_facade: wechat
                  xbuilder_wechat_mini_program_appid: <caller-mini-program-app-id>
      responses:
        "201":
          description: Pushed authorization request and private credentials created.
          headers:
            Cache-Control:
              $ref: "#/components/headers/AccountNoStore"
            Pragma:
              description: Do not cache OAuth responses in HTTP/1.0 caches.
              schema:
                type: string
                enum:
                  - no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthPushedAuthorizationResponse"
        "400":
          $ref: "#/components/responses/OAuthError"
        "401":
          $ref: "#/components/responses/OAuthInvalidClient"
        "415":
          $ref: "#/components/responses/OAuthUnsupportedMediaType"
        "429":
          $ref: "#/components/responses/OAuthTooManyRequests"
        "500":
          $ref: "#/components/responses/OAuthServerError"

  /account/oauth/authorize:
    get:
      operationId: authorizeAccountOAuthApp
      tags:
        - Account OAuth
      summary: Open browser authorization through Account Web
      description: |
        Browser navigation entry for a pending web PAR only. Validate client, request reference, facade, and
        one-time entry credential, then return 302 to the fixed Account Web sign-in page. This endpoint does not
        authenticate an identity, create an Account session, or issue the authorization code. Account Web binds the
        entry with its saved flow cookie and completes authorization through structured flow operations. WeChat
        opens the configured main mini program through platform navigation instead. An authorized return opens
        Account Web directly rather than submitting a consumed or expired PAR here. Validation errors remain local
        and never redirect to an unverified callback.
      security: []
      parameters:
        - name: client_id
          in: query
          required: true
          description: OAuth client bound to the PAR.
          schema:
            $ref: "#/components/schemas/OAuthClientID"
        - name: request_uri
          in: query
          required: true
          description: Opaque pending web PAR reference.
          schema:
            $ref: "#/components/schemas/AccountRequestURI"
        - name: xbuilder_entry_token
          in: query
          required: true
          description: |
            One-time entry credential. Account Web saves it temporarily in sessionStorage, immediately removes it from
            the URL, and discards it after binding is confirmed.
          schema:
            $ref: "#/components/schemas/AccountOpaqueCredential"
      responses:
        "302":
          description: Redirect only to the configured Account Web /sign-in entry.
          headers:
            Cache-Control:
              $ref: "#/components/headers/AccountNoStore"
            Referrer-Policy:
              $ref: "#/components/headers/AccountNoReferrer"
            Location:
              description: |
                Account Web URL carrying `clientID`, `requestURI`, the one-time entry credential, and optional UI locales.
                It never contains a session token, PKCE verifier, or recovery credential.
              schema:
                type: string
                minLength: 1
                format: uri
        "400":
          $ref: "#/components/responses/OAuthError"
        "429":
          $ref: "#/components/responses/OAuthTooManyRequests"
        "500":
          $ref: "#/components/responses/OAuthServerError"

  /account/oauth/token:
    post:
      operationId: createAccountOAuthToken
      tags:
        - Account OAuth
      summary: Create an OAuth token
      description: |
        Exchange an authorization code, rotate a refresh token, or create an app-only access token.

        Authorization codes must be exchanged by the original OAuth client, with the original redirect URI and a
        matching PKCE verifier.

        Refresh requests cannot expand the original refresh token scope. The replacement refresh token retains that
        scope. Reuse of a consumed refresh token revokes its token family.

        App-only access uses `client_credentials` with a confidential client and explicitly requested, approved scopes.
        It does not issue a refresh token.
      security:
        - oauthClientSecretBasic: []
        - {}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/CreateOAuthTokenRequest"
      responses:
        "200":
          description: Successful response.
          headers:
            Cache-Control:
              description: OAuth token responses are not cacheable.
              schema:
                type: string
                examples:
                  - no-store
            Pragma:
              description: OAuth token responses are not cacheable by HTTP/1.0 caches.
              schema:
                type: string
                examples:
                  - no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthToken"
        "400":
          $ref: "#/components/responses/OAuthError"
        "401":
          $ref: "#/components/responses/OAuthInvalidClient"
        "415":
          $ref: "#/components/responses/OAuthUnsupportedMediaType"

  /account/oauth/introspect:
    post:
      operationId: introspectAccountOAuthToken
      tags:
        - Account OAuth
      summary: Introspect an OAuth token
      description: |
        Introspect an Account-issued OAuth token using OAuth 2.0 Token Introspection.

        A confidential OAuth client may introspect tokens belonging to the same app. Unknown tokens, inactive tokens,
        and tokens belonging to another app return `{ "active": false }`.

        Only active access tokens include `token_type`, with the value `Bearer`.
      security:
        - oauthClientSecretBasic: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  description: OAuth token to introspect.
                  type: string
                  minLength: 1
                token_type_hint:
                  description: |
                    Hint about the type of token submitted for introspection.

                    Known values include `access_token` and `refresh_token`.
                  type: string
                  minLength: 1
                  examples:
                    - access_token
      responses:
        "200":
          description: Successful response.
          headers:
            Cache-Control:
              description: OAuth token responses are not cacheable.
              schema:
                type: string
                examples:
                  - no-store
            Pragma:
              description: OAuth token responses are not cacheable by HTTP/1.0 caches.
              schema:
                type: string
                examples:
                  - no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthIntrospection"
        "400":
          $ref: "#/components/responses/OAuthError"
        "401":
          $ref: "#/components/responses/OAuthInvalidClient"
        "415":
          $ref: "#/components/responses/OAuthUnsupportedMediaType"

  /account/oauth/revoke:
    post:
      operationId: revokeAccountOAuthToken
      tags:
        - Account OAuth
      summary: Revoke an OAuth token
      description: |
        Revoke a token issued to the requesting OAuth client. Revoking an access token affects that token. Revoking a
        refresh token affects its token family, including when the submitted refresh token has already been consumed.

        Confidential clients authenticate with `client_secret_basic` and must not send `client_id` in the request body.
        Public clients must send `client_id`.

        Requests for unknown tokens or tokens issued to another client succeed without revoking any tokens.
      security:
        - oauthClientSecretBasic: []
        - {}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/RevokeOAuthTokenRequest"
      responses:
        "200":
          description: OAuth token revoked.
        "400":
          $ref: "#/components/responses/OAuthError"
        "401":
          $ref: "#/components/responses/OAuthInvalidClient"
        "415":
          $ref: "#/components/responses/OAuthUnsupportedMediaType"

  /account/flow-tokens:
    post:
      operationId: prepareAccountFlowToken
      tags:
        - Account
      summary: Prepare an Account flow credential
      description: |
        Prepare a private flow credential before binding a request. Web validates a same-origin request, reuses or
        sets its flow cookie, and returns 204. WeChat calls only when no valid local credential exists, receives a
        token, and stores it before opening a request. Preparation creates no user, Account session, or independent
        database flow record.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - facade
              properties:
                facade:
                  $ref: "#/components/schemas/AccountFacade"
      responses:
        "200":
          description: WeChat flow credential prepared.
          headers:
            Cache-Control:
              $ref: "#/components/headers/AccountNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreparedAccountFlowToken"
        "204":
          description: Web flow cookie prepared.
          headers:
            Cache-Control:
              $ref: "#/components/headers/AccountNoStore"
            Set-Cookie:
              $ref: "#/components/headers/AccountFlowSetCookie"
        "400":
          $ref: "#/components/responses/AccountFlowBadRequest"
        "403":
          $ref: "#/components/responses/AccountFlowForbidden"
        "429":
          $ref: "#/components/responses/AccountFlowTooManyRequests"
        "500":
          $ref: "#/components/responses/AccountFlowInternalServerError"

  /account/authorization-requests/entry:
    post:
      operationId: prepareAccountAuthorizationEntry
      tags:
        - Account
      summary: Prepare an Account authorization entry
      description: |
        The integrating app backend prepares or refreshes a one-time entry using its private recovery credential.
        Confidential clients also authenticate with `client_secret_basic`. Pending authorization uses authorize. An
        authorized request with an available code uses return and requires the original facade flow credential when
        opened. Preparing entry does not expose a code or permit rebinding an authorized request. The returned entry
        expires within 60 seconds and does not extend the PAR or code lifetime.
      security:
        - oauthClientSecretBasic: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountAuthorizationRecoveryRequest"
            examples:
              originalRequest:
                value:
                  clientID: K7mR2qV9sT4wX6yZ8aB0Cg
                  requestURI: urn:ietf:params:oauth:request_uri:par_reference
                  recoveryToken: RRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRR
      responses:
        "200":
          description: Successful response.
          headers:
            Cache-Control:
              $ref: "#/components/headers/AccountNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountAuthorizationEntry"
        "400":
          $ref: "#/components/responses/AccountFlowBadRequest"
        "401":
          $ref: "#/components/responses/AccountFlowUnauthorized"
        "403":
          $ref: "#/components/responses/AccountFlowForbidden"
        "404":
          $ref: "#/components/responses/AccountFlowNotFound"
        "409":
          $ref: "#/components/responses/AccountFlowConflict"
        "410":
          $ref: "#/components/responses/AccountFlowExpired"
        "429":
          $ref: "#/components/responses/AccountFlowTooManyRequests"
        "500":
          $ref: "#/components/responses/AccountFlowInternalServerError"

  /account/authorization-requests/status:
    post:
      operationId: getAccountAuthorizationStatus
      tags:
        - Account
      summary: Get Account authorization status
      description: |
        The integrating app backend queries the known authorization request with its private recovery credential and
        client binding. Confidential clients also use `client_secret_basic`. This endpoint reports status and code
        availability, never the authorization code, verified identity, or Account session. It reads terminal records
        even after the PAR has been consumed or expired. A code may remain available until its own fixed deadline.
      security:
        - oauthClientSecretBasic: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountAuthorizationRecoveryRequest"
      responses:
        "200":
          description: Successful response.
          headers:
            Cache-Control:
              $ref: "#/components/headers/AccountNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationStatus"
              examples:
                pending:
                  value:
                    requestURI: urn:ietf:params:oauth:request_uri:par_reference
                    version: 1
                    status: pending
                    state: state_reference
                    expiresAt: 2026-11-05T12:10:00Z
                authorized:
                  value:
                    requestURI: urn:ietf:params:oauth:request_uri:par_reference
                    version: 4
                    status: authorized
                    state: state_reference
                    codeAvailable: true
                    codeExpiresAt: 2026-11-05T12:07:00Z
                consumed:
                  value:
                    requestURI: urn:ietf:params:oauth:request_uri:par_reference
                    version: 4
                    status: authorized
                    state: state_reference
                    codeAvailable: false
                    codeExpiresAt: 2026-11-05T12:07:00Z
                    unavailableReason: consumed
        "400":
          $ref: "#/components/responses/AccountFlowBadRequest"
        "401":
          $ref: "#/components/responses/AccountFlowUnauthorized"
        "403":
          $ref: "#/components/responses/AccountFlowForbidden"
        "404":
          $ref: "#/components/responses/AccountFlowNotFound"
        "429":
          $ref: "#/components/responses/AccountFlowTooManyRequests"
        "500":
          $ref: "#/components/responses/AccountFlowInternalServerError"

  /account/authorization-requests/cancel:
    post:
      operationId: cancelAccountAuthorizationRequest
      tags:
        - Account
      summary: Cancel an unfinished Account authorization request
      description: |
        The integrating app backend targets cancellation using its private recovery credential. Confidential clients
        also use `client_secret_basic`. Cancel unfinished authorization and invalidate its in-flight authentication
        results. Repeating cancellation or cancelling a finished request returns the stored state without changing
        an issued result or revoking an established Account session.
      security:
        - oauthClientSecretBasic: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountAuthorizationRecoveryRequest"
      responses:
        "200":
          description: Successful response.
          headers:
            Cache-Control:
              $ref: "#/components/headers/AccountNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationStatus"
        "400":
          $ref: "#/components/responses/AccountFlowBadRequest"
        "401":
          $ref: "#/components/responses/AccountFlowUnauthorized"
        "403":
          $ref: "#/components/responses/AccountFlowForbidden"
        "404":
          $ref: "#/components/responses/AccountFlowNotFound"
        "429":
          $ref: "#/components/responses/AccountFlowTooManyRequests"
        "500":
          $ref: "#/components/responses/AccountFlowInternalServerError"

  /account/authorization-requests/open:
    post:
      operationId: openAccountAuthorizationRequest
      tags:
        - Account
      summary: Open an Account authorization request
      description: |
        Use the saved facade flow credential to consume a one-time entry credential and bind the request. A retry
        with the same flow credential returns the existing context. Reentering pending authorization with a new flow
        credential first cancels old authentication and clears its results. An authorized return accepts only the
        original flow credential and returns `return_context_lost` if it is missing. WeChat supplies the actual
        platform source AppID, or the main mini program AppID for local entry. The backend validates the registered
        callback and caller association. Opening performs no authentication or session creation.
      security:
        - accountFlowCookie: []
        - accountFlowToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenAccountAuthorizationRequest"
            examples:
              wechat:
                value:
                  clientID: K7mR2qV9sT4wX6yZ8aB0Cg
                  requestURI: urn:ietf:params:oauth:request_uri:par_reference
                  entryToken: EEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEE
                  facade: wechat
                  sourceMiniProgramAppID: <caller-mini-program-app-id>
      responses:
        "200":
          description: Successful response.
          headers:
            Cache-Control:
              $ref: "#/components/headers/AccountNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationContext"
        "400":
          $ref: "#/components/responses/AccountFlowBadRequest"
        "401":
          $ref: "#/components/responses/AccountFlowUnauthorized"
        "403":
          $ref: "#/components/responses/AccountFlowForbidden"
        "404":
          $ref: "#/components/responses/AccountFlowNotFound"
        "409":
          $ref: "#/components/responses/AccountFlowConflict"
        "410":
          $ref: "#/components/responses/AccountFlowExpired"
        "429":
          $ref: "#/components/responses/AccountFlowTooManyRequests"
        "500":
          $ref: "#/components/responses/AccountFlowInternalServerError"

  /account/authorization-requests/context:
    post:
      operationId: getAccountAuthorizationContext
      tags:
        - Account
      summary: Get the bound Account authorization context
      description: |
        Read trusted request data, authentication choices, and the current Account session using the bound facade
        flow credential. A Web session cookie or WeChat Account session Bearer may additionally supply the current
        account. The session must belong to the same facade. Supplying both session channels returns 400. An
        authorized context displays `authorizedUser` from the issued result rather than a newly selected account.
      security:
        - accountFlowCookie: []
        - accountFlowToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountAuthorizationContextRequest"
      responses:
        "200":
          description: Successful response.
          headers:
            Cache-Control:
              $ref: "#/components/headers/AccountNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationContext"
        "400":
          $ref: "#/components/responses/AccountFlowBadRequest"
        "401":
          $ref: "#/components/responses/AccountFlowUnauthorized"
        "403":
          $ref: "#/components/responses/AccountFlowForbidden"
        "404":
          $ref: "#/components/responses/AccountFlowNotFound"
        "429":
          $ref: "#/components/responses/AccountFlowTooManyRequests"
        "500":
          $ref: "#/components/responses/AccountFlowInternalServerError"

  /account/authorization-requests/decision:
    post:
      operationId: decideAccountAuthorizationRequest
      tags:
        - Account
      summary: Decide Account authorization
      description: |
        Submit approve, deny, or cancel from the bound facade. Approval requires a valid Account session for the
        same facade and matching `expectedUserID` and `expectedSessionID`. Validate version, current account, app
        and client availability, requested scopes, and registered return configuration. Issue one authorization code
        and consume the PAR atomically. Denial and cancellation do not require a signed-in account. Repeating a
        finished decision returns its original result without authorizing another account. State-changing Web
        requests validate `Origin`.
      security:
        - accountFlowCookie: []
        - accountFlowToken: []
        - accountFlowCookie: []
          accountSessionCookie: []
        - accountFlowToken: []
          accountSessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideAccountAuthorizationRequest"
      responses:
        "200":
          description: Successful response.
          headers:
            Cache-Control:
              $ref: "#/components/headers/AccountNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationResult"
        "400":
          $ref: "#/components/responses/AccountFlowBadRequest"
        "401":
          $ref: "#/components/responses/AccountFlowUnauthorized"
        "403":
          $ref: "#/components/responses/AccountFlowForbidden"
        "404":
          $ref: "#/components/responses/AccountFlowNotFound"
        "409":
          $ref: "#/components/responses/AccountFlowConflict"
        "410":
          $ref: "#/components/responses/AccountFlowExpired"
        "429":
          $ref: "#/components/responses/AccountFlowTooManyRequests"
        "500":
          $ref: "#/components/responses/AccountFlowInternalServerError"

  /account/authorization-requests/return:
    post:
      operationId: getAccountAuthorizationReturn
      tags:
        - Account
      summary: Recover the original authorization return
      description: |
        Only the original bound facade may read and redeliver the same authorization result through its registered
        return channel. Validate the code deadline, consumption, and revocation independently of the original PAR
        deadline. Do not repeat account selection, issue another code, or require the current Account session to
        match an already issued result. A recovery credential cannot call this endpoint. A lost original flow
        credential requires new authorization. For mini programs, return only when the current platform navigation
        relationship still matches the original caller.
      security:
        - accountFlowCookie: []
        - accountFlowToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountAuthorizationContextRequest"
      responses:
        "200":
          description: Successful response.
          headers:
            Cache-Control:
              $ref: "#/components/headers/AccountNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationResult"
        "400":
          $ref: "#/components/responses/AccountFlowBadRequest"
        "401":
          $ref: "#/components/responses/AccountFlowUnauthorized"
        "403":
          $ref: "#/components/responses/AccountFlowForbidden"
        "404":
          $ref: "#/components/responses/AccountFlowNotFound"
        "409":
          $ref: "#/components/responses/AccountFlowConflict"
        "410":
          $ref: "#/components/responses/AccountFlowExpired"
        "429":
          $ref: "#/components/responses/AccountFlowTooManyRequests"
        "500":
          $ref: "#/components/responses/AccountFlowInternalServerError"

  /account/authentication-requests:
    post:
      operationId: createAccountAuthenticationRequest
      tags:
        - Account
      summary: Create an Account authentication request
      description: |
        Create authentication only for an option returned by the bound authorization context. The backend fixes
        provider application, acquisition, and purpose. Replacing primary authentication cancels the old attempt and
        clears its recoverable results. Creating account proof uses the parent primary authentication version and
        replaces only its active proof. Proof verifies an existing account and never creates a user or session
        independently. The request expires within 5 minutes and no later than its PAR. External-browser
        authentication returns a fixed copy link and a comparison code for both entry points.
      security:
        - accountFlowCookie: []
        - accountFlowToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountAuthenticationRequest"
            examples:
              externalBrowser:
                value:
                  requestURI: urn:ietf:params:oauth:request_uri:par_reference
                  expectedVersion: 2
                  method: google
                  acquisition: external_browser
      responses:
        "201":
          description: Authentication request created.
          headers:
            Cache-Control:
              $ref: "#/components/headers/AccountNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationRequest"
        "400":
          $ref: "#/components/responses/AccountFlowBadRequest"
        "401":
          $ref: "#/components/responses/AccountFlowUnauthorized"
        "403":
          $ref: "#/components/responses/AccountFlowForbidden"
        "404":
          $ref: "#/components/responses/AccountFlowNotFound"
        "409":
          $ref: "#/components/responses/AccountFlowConflict"
        "410":
          $ref: "#/components/responses/AccountFlowExpired"
        "429":
          $ref: "#/components/responses/AccountFlowTooManyRequests"
        "500":
          $ref: "#/components/responses/AccountFlowInternalServerError"

  /account/authentication-requests/{requestID}:
    get:
      operationId: getAccountAuthenticationRequest
      tags:
        - Account
      summary: Get initiating-entry authentication state
      description: |
        Only the initiating context bound to the original PAR can read account actions and verified candidate data.
        An authentication reference alone or a helper flow credential is insufficient. Primary completion can expose
        the saved completion request content while recoverable, but never a raw session token. Resubmit the same
        completion to recover the original session. Account proof returns only an existing verified user and state.
        Terminal state remains readable after proof consumption or expiration. Queries default to every 2 seconds
        and stop when the page is left or the flow ends.
      security:
        - accountFlowCookie: []
        - accountFlowToken: []
      parameters:
        - name: requestID
          in: path
          required: true
          description: Public authentication request reference.
          schema:
            $ref: "#/components/schemas/AuthenticationRequestID"
      responses:
        "200":
          description: Successful response.
          headers:
            Cache-Control:
              $ref: "#/components/headers/AccountNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationRequest"
        "400":
          $ref: "#/components/responses/AccountFlowBadRequest"
        "401":
          $ref: "#/components/responses/AccountFlowUnauthorized"
        "403":
          $ref: "#/components/responses/AccountFlowForbidden"
        "404":
          $ref: "#/components/responses/AccountFlowNotFound"
        "429":
          $ref: "#/components/responses/AccountFlowTooManyRequests"
        "500":
          $ref: "#/components/responses/AccountFlowInternalServerError"

  /account/authentication-requests/{requestID}/credentials:
    post:
      operationId: submitAccountAuthenticationCredentials
      tags:
        - Account
      summary: Submit direct authentication credentials
      description: |
        Accept only password or `wechat_login` acquisition, using the initiating flow credential and current
        version. Passwords verify existing administrator-managed credentials. WeChat codes must come from the
        XBuilder main mini program and are consumed once. Verification has a 15-second timeout and a 30-second
        completion deadline. A failure is persisted before its error response. Query the same authentication state
        after a lost response for the safe reason and allowed recovery actions. An unknown verification result
        requires a fresh authentication request and code, not resubmission of the old code.
      security:
        - accountFlowCookie: []
        - accountFlowToken: []
      parameters:
        - name: requestID
          in: path
          required: true
          description: Public authentication request reference.
          schema:
            $ref: "#/components/schemas/AuthenticationRequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitAccountAuthenticationCredentialsRequest"
            examples:
              password:
                value:
                  expectedVersion: 1
                  type: password
                  username: john
                  password: example-password
              wechat:
                value:
                  expectedVersion: 1
                  type: wechat_code
                  code: fresh-main-mini-program-code
      responses:
        "200":
          description: Successful response.
          headers:
            Cache-Control:
              $ref: "#/components/headers/AccountNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationRequest"
        "400":
          $ref: "#/components/responses/AccountFlowBadRequest"
        "401":
          $ref: "#/components/responses/AccountFlowUnauthorized"
        "403":
          $ref: "#/components/responses/AccountFlowForbidden"
        "404":
          $ref: "#/components/responses/AccountFlowNotFound"
        "409":
          $ref: "#/components/responses/AccountFlowConflict"
        "410":
          $ref: "#/components/responses/AccountFlowExpired"
        "429":
          $ref: "#/components/responses/AccountFlowTooManyRequests"
        "500":
          $ref: "#/components/responses/AccountFlowInternalServerError"

  /account/authentication-requests/{requestID}/start:
    post:
      operationId: startAccountAuthentication
      tags:
        - Account
      summary: Prepare a direct provider or WeChat URL Link entry
      description: |
        Accept `wechat_website`, `wechat_service_account`, `provider_redirect`, or `wechat_url_link` acquisition
        using the initiating flow credential. Fix upstream state, PKCE, nonce, callback, and provider application
        for this authentication. Repeated preparation recovers the same valid provider state and address. URL Link
        generation can be retried for the same authentication request if its response is unknown. External-browser
        provider authentication instead starts through helper/start. Enable the open action only after preparation
        succeeds.
      security:
        - accountFlowCookie: []
      parameters:
        - name: requestID
          in: path
          required: true
