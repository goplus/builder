                enum:
                  - password
        - if:
            properties:
              acquisition:
                type: string
                enum:
                  - wechat_login
            required:
              - acquisition
          then:
            properties:
              method:
                type: string
                enum:
                  - wechat
        - if:
            properties:
              acquisition:
                type: string
                enum:
                  - wechat_website
            required:
              - acquisition
          then:
            properties:
              method:
                type: string
                enum:
                  - wechat
        - if:
            properties:
              acquisition:
                type: string
                enum:
                  - wechat_service_account
            required:
              - acquisition
          then:
            properties:
              method:
                type: string
                enum:
                  - wechat
        - if:
            properties:
              acquisition:
                type: string
                enum:
                  - wechat_url_link
            required:
              - acquisition
          then:
            properties:
              method:
                type: string
                enum:
                  - wechat
        - if:
            properties:
              acquisition:
                type: string
                enum:
                  - provider_redirect
            required:
              - acquisition
          then:
            properties:
              method:
                type: string
                enum:
