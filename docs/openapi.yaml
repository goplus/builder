          schema:
            $ref: "#/components/schemas/Model/properties/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  $ref: "#/components/schemas/AccountOAuthClientSecret/properties/name"
      responses:
        "201":
          description: Account OAuth client secret created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedAccountOAuthClientSecret"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
