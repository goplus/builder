  /account/authentication-requests/{requestID}/complete:
    post:
      operationId: completeAccountAuthentication
      tags:
        - Account
      summary: Confirm an account and complete primary authentication
      description: |
        Only the initiating entry point completes primary authentication. Confirm the resolved account or explicitly
        create or link it, consuming required proof, writing identity changes, and issuing or reusing the initiating
        facade session in one transaction. Linking always requires fresh current account proof matching the target
        user. Never move an identity owned by another user. A current session must match `expectedSessionID` and the
        facade. Reuse a valid session for the same user. Otherwise issue a new one. Web delivers a new token only in
        its session cookie. WeChat returns `sessionToken` only for a new session or recovery of that issuance.
        Repeating the same validated completion recovers its result for at most 5 minutes without creating users or
        sessions again. A changed session returns `account_changed`. Revoked sessions are never reactivated.
      security:
        - accountFlowCookie: []
        - accountFlowToken: []
        - accountFlowCookie: []
          accountSessionCookie: []
        - accountFlowToken: []
          accountSessionBearer: []
      parameters:
        - name: requestID
          in: path
          required: true
          description: Public authentication request reference.
          schema:
            $ref: "#/components/schemas/AuthenticationRequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteAccountAuthenticationRequest"
            examples:
              existingAccount:
                value:
                  expectedVersion: 4
                  action: sign_in
                  expectedUserID: "42"
                  expectedSessionID: null
              newAccount:
                value:
                  expectedVersion: 4
                  action: create_user
                  expectedUserID: null
                  expectedSessionID: null
                  profile:
                    username: john
                    displayName: John Doe
              linkAccount:
                value:
                  expectedVersion: 4
                  action: link_identity
                  expectedUserID: "42"
                  expectedSessionID: null
                  accountProofRequestID: account_proof_reference
      responses:
        "200":
          description: Account operation completed or the same result recovered.
          headers:
            Cache-Control:
              $ref: "#/components/headers/AccountNoStore"
            Set-Cookie:
              $ref: "#/components/headers/AccountSessionSetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationCompletion"
        "400":
          $ref: "#/components/responses/AccountFlowBadRequest"
        "401":
          $ref: "#/components/responses/AccountFlowUnauthorized"
        "403":
          $ref: "#/components/responses/AccountFlowForbidden"
        "404":
          $ref: "#/components/responses/AccountFlowNotFound"
        "409":
          $ref: "#/components/responses/AccountFlowConflict"
        "410":
          $ref: "#/components/responses/AccountFlowExpired"
        "429":
          $ref: "#/components/responses/AccountFlowTooManyRequests"
        "500":
          $ref: "#/components/responses/AccountFlowInternalServerError"

  /account/authentication-requests/{requestID}/cancel:
    post:
      operationId: cancelAccountAuthenticationRequest
      tags:
        - Account
      summary: Cancel the current authentication attempt
      description: |
        The initiating entry point cancels the selected authentication attempt while retaining the still-valid
        original authorization. Clear recoverable proofs and ignore late upstream results. Completed state is not
        overwritten and an established Account session is not revoked. Reauthentication or a method change creates a
        new attempt and never extends the original PAR deadline.
      security:
        - accountFlowCookie: []
        - accountFlowToken: []
      parameters:
        - name: requestID
          in: path
          required: true
          description: Public authentication request reference.
          schema:
            $ref: "#/components/schemas/AuthenticationRequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountAuthenticationVersionRequest"
      responses:
        "200":
          description: Successful response.
          headers:
            Cache-Control:
              $ref: "#/components/headers/AccountNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticationRequest"
        "400":
          $ref: "#/components/responses/AccountFlowBadRequest"
        "401":
          $ref: "#/components/responses/AccountFlowUnauthorized"
        "403":
          $ref: "#/components/responses/AccountFlowForbidden"
        "404":
          $ref: "#/components/responses/AccountFlowNotFound"
        "409":
          $ref: "#/components/responses/AccountFlowConflict"
        "410":
          $ref: "#/components/responses/AccountFlowExpired"
        "429":
          $ref: "#/components/responses/AccountFlowTooManyRequests"
        "500":
          $ref: "#/components/responses/AccountFlowInternalServerError"

  /account/authentication-requests/{requestID}/helper:
