                type: object
                required:
                  - total
                  - data
                properties:
                  total:
                    $ref: "#/components/schemas/ByPage/properties/total"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProjectRelease"
        "301":
          $ref: "#/components/responses/MovedPermanently"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createProjectRelease
      tags:
        - Project Releases
      summary: Create a project release
      description: |
        Create a new release for a specific project.

        The request fails with a conflict if the current project revision does not match `projectRevision`.
      parameters:
        - name: owner
          description: Username of the project's owner.
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Project/properties/owner"
        - name: project
          description: Name of the project.
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Project/properties/name"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - description
                - projectRevision
              properties:
                name:
                  $ref: "#/components/schemas/ProjectRelease/properties/name"
                description:
                  $ref: "#/components/schemas/ProjectRelease/properties/description"
                thumbnail:
                  description: Defaults to the project's thumbnail if not provided.
                  allOf:
                    - $ref: "#/components/schemas/ProjectRelease/properties/thumbnail"
                  minLength: 1
                projectRevision:
                  description: |
                    Expected revision of the project state from which to create the release. The request fails with a
                    conflict if the current project revision does not match this value.
                  type: integer
                  format: int64
                  minimum: 1
                  examples:
                    - 1
      responses:
        "201":
          description: Successfully created the project release.
          headers:
            Location:
              description: Canonical route of the created project release.
              schema:
                type: string
                format: uri-reference
                minLength: 1
                examples:
                  - /projects/john/NiuXiaoQi/releases/v1.2.3
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRelease"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ProjectReleaseCreateConflict"

