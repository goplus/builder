    AccountAuthenticationFailure:
      type: object
      additionalProperties: false
      required:
        - reason
        - allowedActions
      properties:
        reason:
          description: Safe reason mapped to user-facing copy by the client. Raw provider errors are not returned.
          type: string
          enum:
            - invalid_credentials
            - provider_error
            - provider_unavailable
            - missing_identity
            - verification_unknown
            - configuration_changed
        allowedActions:
          type: array
          items:
            type: string
            enum:
              - retry
              - choose_method
          uniqueItems: true
          description: |
            Recovery choices still permitted by the parent authorization and current configuration. Empty when this
            attempt can no longer continue. Retry creates a new authentication request and fresh credentials. Cancelling
            the authorization remains a separate operation.

    AuthenticationRequest:
      type: object
      additionalProperties: false
      required:
        - authenticationRequestID
        - version
        - status
        - method
        - purpose
        - acquisition
        - expiresAt
        - comparisonCode
      properties:
        authenticationRequestID:
          $ref: "#/components/schemas/AuthenticationRequestID"
        version:
          $ref: "#/components/schemas/AccountFlowVersion"
        status:
          type: string
          enum:
            - pending
            - verifying
            - verified
            - completed
            - failed
            - cancelled
            - expired
        method:
          $ref: "#/components/schemas/AccountAuthenticationMethod"
        purpose:
          type: string
          enum:
            - sign_in
            - account_proof
        acquisition:
          $ref: "#/components/schemas/AccountAuthenticationAcquisition"
        expiresAt:
          description: Authentication deadline, at most 5 minutes and no later than its PAR deadline.
          type: string
          minLength: 1
          format: date-time
        comparisonCode:
          description: Public six-digit code displayed by both entry points for the user to compare. It is not a credential.
          type: string
          minLength: 1
          pattern: "^[0-9]{6}$"
        parentAuthenticationRequestID:
          $ref: "#/components/schemas/AuthenticationRequestID"
        accountProofRequestID:
          $ref: "#/components/schemas/AuthenticationRequestID"
        accountAction:
          $ref: "#/components/schemas/AccountAuthenticationAction"
        user:
          $ref: "#/components/schemas/AccountUser"
        helperURL:
          description: Account Web assistance link carrying only the public authentication reference.
          type: string
          minLength: 1
          format: uri
        failure:
          $ref: "#/components/schemas/AccountAuthenticationFailure"
        completionAvailable:
          type: boolean
        completion:
          $ref: "#/components/schemas/CompleteAccountAuthenticationRequest"
      description: |
        Authentication state read by its initiating entry point. It never exposes raw verified subjects, provider
        tokens, or Account session tokens. Replaced attempts retain terminal state but lose recoverable results.
      allOf:
        - if:
            properties:
              acquisition:
                type: string
                enum:
                  - external_browser
            required:
              - acquisition
          then:
            required:
              - helperURL
          else:
            not:
              anyOf:
                - required:
                    - helperURL
        - if:
            properties:
              status:
                type: string
                enum:
                  - failed
            required:
              - status
          then:
            required:
              - failure
          else:
            not:
              anyOf:
                - required:
                    - failure
        - if:
            properties:
              purpose:
                type: string
                enum:
                  - sign_in
              status:
                type: string
                enum:
                  - verified
            required:
              - purpose
              - status
          then:
            required:
              - accountAction
          else:
            not:
              anyOf:
                - required:
                    - accountAction
        - if:
            properties:
              purpose:
                type: string
                enum:
                  - sign_in
              status:
                type: string
                enum:
                  - completed
            required:
              - purpose
              - status
          then:
            required:
              - completionAvailable
          else:
            not:
              anyOf:
                - required:
                    - completionAvailable
                - required:
                    - completion
        - if:
            properties:
              completionAvailable:
                type: boolean
                enum:
                  - true
            required:
              - completionAvailable
          then:
            required:
              - completion
          else:
            not:
              anyOf:
                - required:
                    - completion
        - if:
            properties:
              purpose:
                type: string
                enum:
                  - account_proof
            required:
              - purpose
          then:
            required:
              - parentAuthenticationRequestID
            not:
              anyOf:
                - required:
                    - accountAction
                - required:
                    - completionAvailable
                - required:
                    - completion
                - required:
                    - accountProofRequestID
          else:
            not:
              anyOf:
                - required:
                    - parentAuthenticationRequestID
                - required:
                    - user
        - if:
            properties:
              purpose:
                type: string
                enum:
                  - account_proof
              status:
                type: string
                enum:
                  - verified
            required:
              - purpose
              - status
          then:
            required:
              - user
        - if:
            properties:
              acquisition:
                type: string
                enum:
                  - password
            required:
              - acquisition
          then:
            properties:
              method:
                type: string
                enum:
                  - password
        - if:
            properties:
              acquisition:
                type: string
                enum:
                  - wechat_login
            required:
              - acquisition
          then:
            properties:
              method:
                type: string
                enum:
                  - wechat
        - if:
            properties:
              acquisition:
                type: string
                enum:
                  - wechat_website
            required:
              - acquisition
          then:
            properties:
              method:
                type: string
                enum:
                  - wechat
        - if:
            properties:
              acquisition:
                type: string
                enum:
                  - wechat_service_account
            required:
              - acquisition
          then:
            properties:
              method:
                type: string
                enum:
                  - wechat
        - if:
            properties:
              acquisition:
                type: string
                enum:
                  - wechat_url_link
            required:
              - acquisition
          then:
            properties:
              method:
                type: string
                enum:
                  - wechat
        - if:
            properties:
              acquisition:
                type: string
                enum:
                  - provider_redirect
            required:
              - acquisition
          then:
            properties:
              method:
                type: string
                enum:
                  - qq
                  - github
                  - apple
                  - google
                  - x
        - if:
            properties:
              acquisition:
                type: string
                enum:
                  - external_browser
            required:
              - acquisition
          then:
            properties:
              method:
                type: string
                enum:
                  - qq
                  - github
                  - apple
                  - google
                  - x
      examples:
        - authenticationRequestID: authentication_reference
          version: 2
          status: verified
          method: wechat
          purpose: sign_in
          acquisition: wechat_login
          expiresAt: 2026-11-05T12:05:00Z
          comparisonCode: "123456"
          accountAction:
            type: confirm_account
            allowedActions:
              - sign_in
            user:
              id: "42"
              createdAt: 2026-11-05T12:00:00Z
              updatedAt: 2026-11-05T12:00:00Z
              username: john
              displayName: John Doe
              avatar: https://avatars.example.com/users/42.png
        - authenticationRequestID: authentication_reference
          version: 5
          status: completed
