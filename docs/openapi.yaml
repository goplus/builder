  /admin/account/apps/{appID}/oauth-clients:
    get:
      operationId: listAdminAccountOAuthClients
      tags:
        - Account Admin
      summary: List account OAuth clients as admin
      description: |
        Retrieve a list of OAuth clients registered under an account app.

        Requires the `accountAdmin` role.
      parameters:
        - name: appID
          description: ID of the app.
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Model/properties/id"
        - name: orderBy
          description: Field by which to order the results.
          in: query
          schema:
            type: string
            enum:
              - createdAt
              - updatedAt
            default: createdAt
            examples:
              - createdAt
        - $ref: "#/components/parameters/SortOrder"
        - $ref: "#/components/parameters/PageIndex"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - total
                  - data
                properties:
                  total:
                    $ref: "#/components/schemas/ByPage/properties/total"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AccountOAuthClient"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createAdminAccountOAuthClient
      tags:
        - Account Admin
      summary: Create an account OAuth client as admin
      description: |
        Register an OAuth client for an account app.

        User authorization requires `authorization_code`, optionally `refresh_token`, and at least one exact redirect
        URI. App-only access requires a confidential client with only `client_credentials` and no redirect URIs.

        Requires the `accountAdmin` role.
      parameters:
        - name: appID
          description: ID of the app.
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Model/properties/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - name
                - clientType
                - grantTypes
              properties:
                name:
                  $ref: "#/components/schemas/AccountOAuthClient/properties/name"
                clientType:
                  $ref: "#/components/schemas/AccountOAuthClient/properties/clientType"
                grantTypes:
                  $ref: "#/components/schemas/AccountOAuthClient/properties/grantTypes"
                redirectURIs:
                  $ref: "#/components/schemas/AccountOAuthClient/properties/redirectURIs"
                clientCredentialsScopes:
                  description: Defaults to an empty array if not provided.
                  $ref: "#/components/schemas/AccountOAuthClient/properties/clientCredentialsScopes"
                reason:
                  description: Reason for the change, recorded in the audit log.
                  type: string
                  minLength: 1
                  maxLength: 500
                  pattern: "\\P{White_Space}"
                wechatReturnTargets:
                  description: Defaults to an empty array. All callbacks must be exact registered entries and the client must support user authorization.
                  $ref: "#/components/schemas/AccountOAuthClient/properties/wechatReturnTargets"
              allOf:
                - if:
                    properties:
                      grantTypes:
                        contains:
                          type: string
                          enum:
                            - client_credentials
                    required:
                      - grantTypes
                  then:
                    properties:
                      wechatReturnTargets:
                        maxItems: 0
      responses:
        "201":
          description: Account OAuth client created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountOAuthClient"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /admin/account/apps/{appID}/oauth-clients/{oauthClientID}:
    get:
      operationId: getAdminAccountOAuthClient
      tags:
        - Account Admin
      summary: Get an account OAuth client as admin
      description: |
        Retrieve the configuration of an OAuth client registered under an account app.

        Requires the `accountAdmin` role.
      parameters:
        - name: appID
          description: ID of the app.
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Model/properties/id"
        - name: oauthClientID
          description: Management ID of the OAuth client.
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Model/properties/id"
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountOAuthClient"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateAdminAccountOAuthClient
      tags:
        - Account Admin
      summary: Update an account OAuth client as admin
      description: |
        Update status, exact redirect URIs, WeChat return targets, or approved app-only scopes. Submit
        `wechatReturnTargets` as the complete target array. Validate each unique mini program AppID and callback
        pair against the resulting full client configuration, including redirect URI changes. App-only clients
        require an empty target array. Removing or changing a target invalidates affected unfinished authorization
        and unredeemed codes without revoking existing access tokens solely for that target change. Disabling a
        client revokes its outstanding flows and tokens. Removing scopes revokes tokens using those scopes.
        Re-enabling configuration never revives revoked flows or tokens. Record the management audit in the same
        transaction. Requires `accountAdmin`.
      parameters:
        - name: appID
          description: ID of the app.
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Model/properties/id"
        - name: oauthClientID
          description: Management ID of the OAuth client.
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Model/properties/id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              anyOf:
                - required:
                    - status
                - required:
                    - redirectURIs
                - required:
                    - clientCredentialsScopes
                - required:
                    - wechatReturnTargets
              properties:
                status:
                  $ref: "#/components/schemas/AccountOAuthClient/properties/status"
                redirectURIs:
                  $ref: "#/components/schemas/AccountOAuthClient/properties/redirectURIs"
                clientCredentialsScopes:
                  $ref: "#/components/schemas/AccountOAuthClient/properties/clientCredentialsScopes"
                reason:
                  description: Reason for the change, recorded in the audit log.
                  type: string
                  minLength: 1
                  maxLength: 500
                  pattern: "\\P{White_Space}"
                wechatReturnTargets:
                  $ref: "#/components/schemas/AccountOAuthClient/properties/wechatReturnTargets"
      responses:
        "200":
          description: Account OAuth client updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountOAuthClient"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

