  /account/authentication-requests/{requestID}/helper/wechat:
    post:
      operationId: submitAccountAuthenticationHelperWechat
      tags:
        - Account
      summary: Verify WeChat identity for the initiating browser
      description: |
        For `wechat_url_link` acquisition only. The XBuilder main mini program displays trusted request information
        and the comparison code. After user confirmation, submit a fresh wx.login code and bind the helper flow
        credential. Verify only the fixed main mini program application, recording one-time credential use before
        calling WeChat. Store the verified result without resolving or creating an account or changing any Account
        session. Return only helper status and instruct the user to return to the original browser, which reads the
        result using its own private flow credential.
