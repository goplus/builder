  /copilot/messages:
    post:
      operationId: createCopilotMessage
      tags:
        - Copilot
      summary: Generate a structured SSE stream message
      description: |
        Generate a structured SSE stream message by sending a list of input messages.

        The response is a Server-Sent Events stream where each `data:` line contains a single JSON object.

        Before the stream is established, authentication, request validation, quota or rate-limit failures, and provider
        stream setup failures use the normal JSON `APIError` responses. After the stream has started, provider streaming
        failures are delivered as terminal `error` events.

        Event semantics:

        | Event | Data schema | Semantics |
        |-------|-------------|-----------|
        | `text_delta` | `CopilotSSETextDeltaEvent` | Incremental assistant text fragment. Concatenate `text` values in order to reconstruct `content.text`. |
        | `tool_call_delta` | `CopilotSSEToolCallDeltaEvent` | Incremental fragment for one assistant tool call. Merge fragments by `index`; `id`, `function.name`, and `function.arguments` are omitted when a fragment does not update them. |
        | `done` | `CopilotSSEDoneEvent` | Terminal success event. Emitted after all prior deltas. `finishReason` is the provider finish reason such as `stop` or `tool_calls`. |
        | `error` | `CopilotSSEErrorEvent` | Terminal failure event emitted if streaming fails after the HTTP response has started. No `done` event follows `error`. |

        A successful stream may contain any number of `text_delta` and `tool_call_delta` events before the final `done`
        event. Assistant responses may be text-only, tool-call-only, or contain both.

        Each message consumes 1 quota from the authenticated user's Copilot message allowance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopilotMessageRequest"
      responses:
        "200":
          description: |
            Structured SSE stream established.

            Parse the stream as SSE frames and then decode each event's JSON `data` payload according to the event type.
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE stream containing `text_delta`, `tool_call_delta`, `done`, and `error` events.
              examples:
                textOnly:
                  summary: Text-only assistant response
                  value: |
                    event: text_delta
                    data: {"text":"Hello"}

                    event: text_delta
                    data: {"text":"!"}

                    event: done
                    data: {"finishReason":"stop"}
                textAndToolCall:
                  summary: Assistant text followed by a tool call
                  value: |
                    event: text_delta
                    data: {"text":"Let me check that for you."}

                    event: tool_call_delta
                    data: {"index":0,"id":"call_1","function":{"name":"list_projects","arguments":"{\"query\":\"demo\"}"}}

                    event: done
                    data: {"finishReason":"tool_calls"}
                providerError:
                  summary: Stream failure after the response has started
                  value: |
                    event: error
                    data: {"reason":"streamFailed","message":"stream failed"}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenOrQuotaExceeded"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"

  /ai-interaction/turns:
    post:
      operationId: createAIInteractionTurn
      tags:
        - AI Interaction
      summary: Perform an AI interaction turn
      description: |
        Start or continue an AI interaction sequence and receive the AI's next command, if any.

        Each turn consumes 1 quota from the authenticated user's AI interaction turn allowance.
      requestBody:
        description: Encoded JSON request body, limited to 1 MiB.
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - commandSpecs
              allOf:
                - if:
                    properties:
                      continuationTurn:
                        const: 0
                  then:
                    required:
                      - content
                    properties:
                      content:
                        minLength: 1
                - if:
                    required:
                      - continuationTurn
                    properties:
                      continuationTurn:
                        minimum: 1
                  then:
                    required:
                      - history
                    properties:
                      content:
                        maxLength: 0
                      context:
                        maxProperties: 0
                      history:
                        minItems: 1
              properties:
                content:
                  description: The core user input message.
                  type: string
                  maxLength: 280
                  examples:
                    - What should I do next?
                context:
                  description: Specific context for the current user input.
                  type: object
                  additionalProperties: true
                  examples:
                    - position: [10, 20]
                      health: 80
                role:
                  description: Persona the AI should adopt.
                  type: string
                  examples:
                    - Guide
                roleContext:
                  description: Additional context specific to the role.
                  type: object
                  additionalProperties: true
                  examples:
                    - style: friendly
                      knowledgeScope: game rules
                knowledgeBase:
                  description: Background knowledge provided to the AI.
                  type: object
                  additionalProperties: true
                  examples:
                    - worldName: TestWorld
                      gravity: 9.8
                commandSpecs:
                  description: |
                    Commands the AI is allowed to call.

                    Command names must be unique within the array.
                  type: array
                  minItems: 1
                  maxItems: 128
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        $ref: "#/components/schemas/AIInteractionCommandName"
                      description:
                        description: Explanation of what the command does.
                        type: string
                        maxLength: 1024
                        examples:
                          - Move the character
                      parameters:
                        description: |
                          Complete set of parameters accepted by the command.

                          Every parameter is required, and parameter names must be unique within the array.
                        type: array
                        maxItems: 128
                        items:
                          $ref: "#/components/schemas/AIInteractionCommandParameter"
                history:
                  description: |
                    Completed interaction turns recorded after their requested commands were executed.

                    The first turn must have `isInitial` set to `true`. A turn whose `executedCommandResult.isBreak` is
                    `true` must end its interaction sequence. Each interaction sequence may contain at most 20 turns.
                  type: array
                  items:
                    $ref: "#/components/schemas/AIInteractionTurn"
                archivedHistory:
                  description: Content of archived historical interactions.
                  type: string
                  examples:
                    - "Previous conversation summary..."
                continuationTurn:
                  description: |
                    Current turn number in a multi-turn interaction sequence.

                    - 0 means this is the initial turn from user input.
                    - Values greater than 0 indicate continuation turns and must equal the number of completed turns in
                      the current interaction sequence, including its initial turn.
                    - For a continuation turn, the latest completed turn must not have `executedCommandResult.isBreak`
                      set to `true`.
                  type: integer
                  format: int32
                  minimum: 0
                  maximum: 19
                  default: 0
                  examples:
                    - 0
      responses:
        "200":
          description: |
            Successful AI interaction.

            The response to an initial turn must include `commandName`. For a continuation turn, an empty JSON object
            indicates that the AI requested no further command.
          content:
            application/json:
              schema:
                type: object
                dependentRequired:
                  commandArgs:
                    - commandName
                properties:
                  commandName:
                    $ref: "#/components/schemas/AIInteractionCommandName"
                  commandArgs:
                    $ref: "#/components/schemas/AIInteractionCommandArguments"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenOrQuotaExceeded"
        "413":
          $ref: "#/components/responses/ContentTooLarge"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"

  /ai-interaction/archives:
    post:
      operationId: createAIInteractionArchive
      tags:
        - AI Interaction
      summary: Archive AI interaction history
      description: |
        Archive a batch of interaction turns into a condensed summary for future context.

        Each archive request consumes 1 quota from the authenticated user's AI interaction archive allowance.
      requestBody:
        description: Encoded JSON request body, limited to 1 MiB.
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - turns
              properties:
                turns:
                  description: |
                    Completed interaction turns to be archived at an interaction sequence boundary.

                    The first turn must have `isInitial` set to `true`. A turn whose `executedCommandResult.isBreak` is
                    `true` must end its interaction sequence. Each interaction sequence may contain at most 20 turns.
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    $ref: "#/components/schemas/AIInteractionTurn"
                existingArchive:
                  description: Existing archived content to be merged with new turns.
                  type:
                    - string
                    - "null"
                  examples:
                    - "Previous conversation summary..."
      responses:
        "200":
          description: Successfully archived interaction history.
          content:
            application/json:
              schema:
                type: object
                required:
