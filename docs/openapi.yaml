        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Opaque
      description: |
        Opaque access token, in the format `Bearer {token}`.

        XBuilder Account access tokens are issued by `/account/oauth/token` and can be validated with
        `/account/oauth/introspect`.

    accountSessionCookie:
      type: apiKey
      in: cookie
      name: __Host-xbuilder-account-session
      description: |
        Account session cookie used by Account Web.

        The cookie must be `HttpOnly`, `Secure`, `SameSite=Lax`, use `Path=/`, and omit `Domain`.

        Cookie-authenticated mutation endpoints must validate Origin or use equivalent CSRF protection.

    oauthClientSecretBasic:
      type: http
      scheme: basic
      description: OAuth client authentication using client secret basic.

    accountFlowCookie:
      type: apiKey
      in: cookie
      name: __Host-xbuilder-account-flow
      description: |
        Private Account Web flow credential. HttpOnly, Secure, SameSite=Lax, Path=/, no Domain, with a 30-minute
        cookie lifetime. It binds authorization or helping context and is independent of the Account session cookie.
        State-changing Web operations validate the trusted `Origin`.

    accountFlowToken:
      type: apiKey
      in: header
      name: Account-Flow-Token
      description: |
        Private main mini program flow credential. Submit it only to bound Account flow operations. It is not an
        Account session or product token and never enters navigation parameters.

    accountSessionBearer:
      type: http
      scheme: bearer
      description: |
        Opaque Account WeChat session token, accepted only by Account flow operations and GET or DELETE
        /account/session. The backend requires facade=wechat. It is not an OAuth access token and cannot
        authenticate product APIs or OAuth token exchange. Supplying it with an Account session cookie returns 400.

    signInFlowCookie:
      type: apiKey
      in: cookie
      name: __Host-xbuilder-sign-in-flow
      description: |
        Private XBuilder product sign-in flow cookie for browsers and business H5 pages. HttpOnly, Secure,
        SameSite=Lax, Path=/, no Domain, with a 30-minute cookie lifetime. It is not passed to Account facades or
        mini program hosts. Requests validate the product trusted `Origin`.

    signInFlowToken:
      type: apiKey
      in: header
      name: Sign-In-Token
      description: |
        Private local product sign-in flow credential for native mini program pages. It is returned only at creation
        and never passed to Account facades or a web-view host.

  responses:
    MovedPermanently:
      description: Requested resource moved to its canonical route.
      headers:
        Location:
          description: Canonical route of the requested resource.
          schema:
            type: string
            format: uri-reference
            minLength: 1
        Cache-Control:
          description: |
            Cache policy for canonical redirects.

            `no-cache` requires revalidation before reuse because non-canonical routes may later be reused by different
            resources.
          schema:
            type: string
            example: no-cache

    ResourceMoved:
      description: |
        Requested resource moved to its canonical route. Returned on non-`GET` and non-`HEAD` requests.

        The response includes a `canonical` payload with the canonical route. Clients may update the request and
        resubmit it explicitly.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MovedResourceError"

    ProjectUpdateConflict:
      description: |
        The update conflicts with current project state because the requested project route moved or the requested name
        is unavailable.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ConflictError"
              - $ref: "#/components/schemas/MovedResourceError"

    ProjectReleaseCreateConflict:
      description: |
        The release creation conflicts with current project state because `projectRevision` does not match the current
        project revision or the requested project route moved.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ConflictError"
              - $ref: "#/components/schemas/MovedResourceError"

    BadRequest:
      description: Invalid request syntax, parameters, or body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
          examples:
            invalidArgs:
              value:
                code: 40001
                msg: Invalid args

    Unauthorized:
      description: Authentication is required or the supplied bearer token is invalid.
      headers:
        WWW-Authenticate:
          description: Authentication challenge.
          schema:
            type: string
            examples:
              - Bearer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
          examples:
            unauthorized:
              value:
                code: 40100
                msg: Unauthorized

    Forbidden:
      description: The authenticated principal does not have permission to perform this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
          examples:
            forbidden:
              value:
                code: 40300
                msg: Forbidden

    ForbiddenOrQuotaExceeded:
      description: |
        The authenticated principal does not have permission to perform this operation, or a long-window quota was
        exceeded.

        When `code` is `40301`, the response may include `Retry-After`.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
          examples:
            forbidden:
              value:
                code: 40300
                msg: Forbidden
            quotaExceeded:
              value:
                code: 40301
                msg: aigc:image quota exceeded

    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
          examples:
            notFound:
              value:
                code: 40400
                msg: Not found

    Conflict:
      description: The request conflicts with the current resource state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
          examples:
            conflict:
              value:
                code: 40900
                msg: Conflict

    ContentTooLarge:
      description: The request or uploaded content exceeds the allowed size.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
          examples:
            contentTooLarge:
              value:
                code: 41300
                msg: Content too large

    UnsupportedMediaType:
      description: The request or uploaded content type is not supported.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
          examples:
            unsupportedMediaType:
              value:
                code: 41500
                msg: Unsupported media type

    TooManyRequests:
      description: Too many requests.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
          examples:
            tooManyRequests:
              value:
                code: 42900
                msg: Too many requests

    RateLimitExceeded:
      description: The authenticated user exceeded a short-window rate limit for this operation.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
          examples:
            rateLimitExceeded:
              value:
                code: 42901
                msg: aigc:image rate limit exceeded

    InternalServerError:
      description: An internal server error occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
          examples:
            internalServerError:
              value:
                code: 50000
                msg: Internal server error

    UnsupportedScratchFeature:
      description: The uploaded Scratch project uses a feature that cannot be converted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
          examples:
            unsupportedScratchFeature:
              value:
                code: 50101
                msg: Unsupported scratch feature

    OAuthError:
      description: OAuth error response.
      headers:
        Cache-Control:
          description: OAuth error responses are not cacheable.
          schema:
            type: string
            example: no-store
        Pragma:
          description: OAuth error responses are not cacheable by HTTP/1.0 caches.
          schema:
            type: string
            example: no-cache
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuthError"

    OAuthInvalidClient:
      description: OAuth client authentication failed.
      headers:
        Cache-Control:
          description: OAuth error responses are not cacheable.
          schema:
            type: string
            example: no-store
        Pragma:
          description: OAuth error responses are not cacheable by HTTP/1.0 caches.
          schema:
            type: string
            example: no-cache
        WWW-Authenticate:
          description: Client authentication challenge.
          schema:
            type: string
            examples:
              - Basic realm="XBuilder Account", error="invalid_client"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuthError"

    OAuthInsufficientScope:
      description: The OAuth bearer token's subject or scope does not permit this operation.
      headers:
        WWW-Authenticate:
          description: Bearer token insufficient scope challenge.
          schema:
            type: string
            examples:
              - Bearer realm="XBuilder Account", error="insufficient_scope", scope="account:app:read"
              - Bearer realm="XBuilder Account", error="insufficient_scope", scope="account:user:read"
              - Bearer realm="XBuilder Account", error="insufficient_scope", scope="account:user:write"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
          examples:
            insufficientScope:
              value:
                code: 40300
                msg: Forbidden

    AccountForbidden:
      description: |
        Account request is forbidden.

        Bearer-token requests may lack the required scope. Cookie-authenticated mutation requests may fail Origin
        validation.
      headers:
        WWW-Authenticate:
          description: Bearer token insufficient scope challenge, when bearer authentication was used.
          schema:
            type: string
            examples:
              - Bearer realm="XBuilder Account", error="insufficient_scope", scope="account:user:write"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
          examples:
            forbidden:
              value:
                code: 40300
                msg: Forbidden

    OAuthUnsupportedMediaType:
      description: |
        OAuth form request content type is not supported.

        The server returns an OAuth `invalid_request` error before reading form-body OAuth parameters.
      headers:
        Cache-Control:
          description: OAuth error responses are not cacheable.
          schema:
            type: string
            example: no-store
        Pragma:
          description: OAuth error responses are not cacheable by HTTP/1.0 caches.
          schema:
            type: string
            example: no-cache
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuthError"

    AccountUnauthorized:
      description: |
        Account authentication is required.

        The request may authenticate with an account session cookie or an OAuth bearer token.

        The response includes `WWW-Authenticate`.

        Challenge values:

        - Missing credentials use the generic `Bearer` challenge.
        - Invalid bearer tokens use a realm-specific `invalid_token` challenge.
      headers:
        WWW-Authenticate:
          description: Bearer token challenge.
          schema:
            type: string
            examples:
              - Bearer
              - Bearer realm="XBuilder Account", error="invalid_token"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
          examples:
            unauthorized:
              value:
                code: 40100
                msg: Unauthorized

    AccountFlowBadRequest:
      description: |
        Invalid parameters, conflicting credential categories, or rejected submitted credentials. Verification
        failures are persisted before responding. Read the bound authentication request for its safe failure reason.
      headers:
        Cache-Control:
          $ref: "#/components/headers/AccountNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"

    AccountFlowUnauthorized:
      description: |
        A required flow credential, local product flow credential, recovery credential, or Account session is
        missing or invalid. These credential categories are not interchangeable.
      headers:
        Cache-Control:
          $ref: "#/components/headers/AccountNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"

    AccountFlowForbidden:
      description: The source, facade, client purpose, operation, or trusted `Origin` is not allowed.
      headers:
        Cache-Control:
          $ref: "#/components/headers/AccountNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"

    AccountFlowNotFound:
      description: |
        The target associated with the supplied credential or public helper reference does not exist. Other requests
        are not disclosed.
      headers:
        Cache-Control:
          $ref: "#/components/headers/AccountNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"

    AccountFlowConflict:
      description: |
        The request conflicts with the current flow or account state. Branch on reason and reread context when
        appropriate.
      headers:
        Cache-Control:
          $ref: "#/components/headers/AccountNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AccountFlowConflictError"

    AccountFlowExpired:
      description: |
        An operation requires a request or proof that has expired. Status queries still return stored terminal state
        rather than replacing it with this error.
      headers:
        Cache-Control:
          $ref: "#/components/headers/AccountNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AccountFlowExpiredError"

    AccountFlowTooManyRequests:
      description: Sign-in, public entry, or recovery rate limit exceeded. Honor `Retry-After` before retrying.
      headers:
        Cache-Control:
          $ref: "#/components/headers/AccountNoStore"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"

    AccountFlowInternalServerError:
      description: |
        A server or upstream failure occurred. Retain flow correlation and query known state before retrying. Never
        replay a provider code or authorization code after an unknown verification or exchange outcome.
      headers:
        Cache-Control:
          $ref: "#/components/headers/AccountNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"

    OAuthTooManyRequests:
      description: OAuth request rate limit exceeded. Honor `Retry-After` before retrying.
      headers:
        Cache-Control:
          $ref: "#/components/headers/AccountNoStore"
        Pragma:
          description: Do not cache OAuth responses in HTTP/1.0 caches.
          schema:
            type: string
            enum:
              - no-cache
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuthError"

    OAuthServerError:
      description: |
        OAuth processing failed temporarily. Preserve request correlation and do not replay an authorization code
        after an unknown exchange result.
      headers:
        Cache-Control:
          $ref: "#/components/headers/AccountNoStore"
        Pragma:
          description: Do not cache OAuth responses in HTTP/1.0 caches.
          schema:
            type: string
            enum:
              - no-cache
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuthError"

  headers:
    RetryAfter:
      description: |
        Number of seconds to wait before retrying.

        The header is included when the server can compute a retry time.
      schema:
        type: integer
        format: int64
        minimum: 1

    AccountNoStore:
      description: All flow, recovery, credential, and callback responses are not cacheable.
      schema:
        type: string
        enum:
          - no-store

    AccountNoReferrer:
      description: Do not disclose authorization paths or query parameters through referrers.
      schema:
        type: string
        enum:
          - no-referrer

    AccountFlowSetCookie:
      description: |
        Set or reuse `__Host-xbuilder-account-flow` with HttpOnly, Secure, SameSite=Lax, Path=/, no Domain, and
        Max-Age=1800. No Account session is created.
      schema:
        type: string

    AccountSessionSetCookie:
      description: |
        Set `__Host-xbuilder-account-session` only for a newly issued or recovered Web session, with HttpOnly,
        Secure, SameSite=Lax, Path=/, and no Domain. Reusing a valid session does not create a new token.
      schema:
        type: string

    SignInFlowSetCookie:
      description: |
        Set or reuse `__Host-xbuilder-sign-in-flow` for web and `wechat_web_view`, with HttpOnly, Secure,
        SameSite=Lax, Path=/, no Domain, and Max-Age=1800. Native mini program creation returns `signInToken`
        instead.
      schema:
        type: string

  schemas:
    APIError:
      description: |
        Shared error payload for most non-OAuth JSON endpoints.

        `msg` is a safe, developer-facing diagnostic string. It is not localized and is not stable enough for
        programmatic handling.

        User-facing clients should map `code` to their own localized copy.
      type: object
      required:
        - code
        - msg
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        msg:
          description: Safe developer-facing diagnostic message.
          type: string
          minLength: 1
          examples:
            - Invalid args

    ErrorCode:
      description: |
        Stable machine-readable error code for the shared `APIError` envelope.

        The first three digits match the HTTP status code. Clients should branch on this field instead of parsing `msg`.

        | Code | HTTP status | Default msg | Meaning |
        |------|-------------|-------------|---------|
        | 40001 | 400 | Invalid args | Invalid request syntax, parameters, or body. |
        | 40100 | 401 | Unauthorized | Authentication is required or invalid. |
        | 40300 | 403 | Forbidden | The authenticated principal lacks permission. |
        | 40301 | 403 | Quota exceeded | A long-window quota was exceeded. |
        | 40400 | 404 | Not found | The requested resource was not found. |
        | 40900 | 409 | Conflict | The request conflicts with current resource state. |
        | 40901 | 409 | Resource moved | The request used a historical resource route. |
        | 41000 | 410 | Gone | An Account request or proof required for this operation has expired. |
        | 41300 | 413 | Content too large | Request or uploaded content exceeds the allowed size. |
        | 41500 | 415 | Unsupported media type | Request or uploaded content type is not supported. |
        | 42900 | 429 | Too many requests | Generic request throttling. |
        | 42901 | 429 | Rate limit exceeded | A short-window rate limit was exceeded. |
        | 50000 | 500 | Internal server error | An unexpected server-side failure occurred. |
        | 50101 | 501 | Unsupported scratch feature | Scratch conversion hit an unsupported feature. |
      type: integer
      format: int32
      enum:
        - 40001
        - 40100
        - 40300
        - 40301
        - 40400
        - 40900
        - 40901
        - 41000
        - 41300
        - 41500
        - 42900
        - 42901
        - 50000
        - 50101
      examples:
        - 40001

    ConflictError:
      description: Error payload for a generic resource conflict.
      type: object
      required:
        - code
        - msg
      properties:
        code:
          type: integer
          format: int32
          enum:
            - 40900
        msg:
          type: string
          enum:
            - Conflict

    MovedResourceError:
      description: |
        Error payload for a moved resource route.

        This follows the `APIError` envelope and adds `canonical` route metadata.
      type: object
      required:
        - code
        - msg
        - canonical
      properties:
        code:
          description: Stable error code for moved resources.
          type: integer
          format: int32
          enum:
            - 40901
        msg:
          description: Human-readable moved resource error message.
          type: string
          enum:
            - Resource moved
        canonical:
          $ref: "#/components/schemas/MovedResourceCanonical"

    MovedResourceCanonical:
      description: |
        Canonical route information for a moved resource.

        Route fields:

        - User routes include `path` and `username`.
        - Project routes include `path`, `owner`, and `name`.
        - Project release routes include `path`, `owner`, `name`, and `release`.
      type: object
      required:
        - path
      properties:
        path:
          description: Canonical route path of the requested resource.
          type: string
          format: uri-reference
          minLength: 1
          examples:
            - /projects/john/NiuXiaoQi
        username:
          description: Canonical username of the moved user route.
          $ref: "#/components/schemas/User/properties/username"
          examples:
            - john
        owner:
          description: Canonical owner username of the moved project or project release route.
          $ref: "#/components/schemas/User/properties/username"
          examples:
            - john
        name:
          description: Canonical project name of the moved project or project release route.
          $ref: "#/components/schemas/Project/properties/name"
          examples:
            - NiuXiaoQi
        release:
          description: Canonical release name of the moved project release route.
          $ref: "#/components/schemas/ProjectRelease/properties/name"
          examples:
            - v1.2.3

    ByPage:
      description: Paginated response wrapper.
      type: object
      required:
        - total
        - data
      properties:
        total:
          description: Total number of result items in the result set.
          type: integer
          format: int64
          minimum: 0
        data:
          description: Array of result items.
          type: array
          items:
            type: object

    ByPageToken:
      description: Paginated response wrapper using page tokens.
      type: object
      required:
        - total
        - data
        - nextPageToken
      properties:
        total:
          $ref: "#/components/schemas/ByPage/properties/total"
        data:
          $ref: "#/components/schemas/ByPage/properties/data"
        nextPageToken:
          description: Opaque token for the next page, or `null` when pagination is complete.
          type:
            - string
            - "null"
          minLength: 1

    Model:
      type: object
      description: Base model with common fields for all entities.
      required:
        - id
        - createdAt
        - updatedAt
      properties:
        id:
          description: Unique positive int64 identifier serialized as a canonical decimal string.
          type: string
          minLength: 1
          maxLength: 19
          pattern: "^[1-9][0-9]{0,18}$"
          examples:
            - "1"
        createdAt:
          description: Creation timestamp.
          type: string
          format: date-time
          examples:
            - 2006-01-02T15:04:05+07:00
        updatedAt:
          description: Last update timestamp.
          type: string
          format: date-time
          examples:
            - 2006-01-02T15:04:05+07:00

    Visibility:
      description: Visibility setting for resources.
      type: string
      enum:
        - private
        - public
      examples:
        - private

    AccountUser:
      description: User fields exposed by XBuilder Account.
      type: object
      required:
        - id
        - createdAt
        - updatedAt
        - username
        - displayName
        - avatar
      properties:
        id:
          $ref: "#/components/schemas/Model/properties/id"
        createdAt:
          $ref: "#/components/schemas/Model/properties/createdAt"
        updatedAt:
          $ref: "#/components/schemas/Model/properties/updatedAt"
        username:
          $ref: "#/components/schemas/User/properties/username"
        displayName:
          $ref: "#/components/schemas/User/properties/displayName"
        avatar:
          description: Public HTTP URL of the user's avatar image.
          type: string
          format: uri
          pattern: "^https?://"
          examples:
            - https://avatars.example.com/users/10137.png

    AccountManagedPassword:
      description: Administrator-managed password using printable ASCII characters with no leading or trailing spaces.
      type: string
      minLength: 8
      maxLength: 128
      pattern: "^[!-~][ -~]*[!-~]$"
      examples:
        - 1abc def2

    AccountFacade:
      description: Facade owning this flow or Account session.
      type: string
      enum:
        - web
        - wechat

    AccountProviderName:
      description: Registered third-party identity provider.
      type: string
      enum:
        - wechat
        - qq
        - github
        - apple
        - google
        - x

    AccountWechatMiniProgramAppID:
      description: WeChat mini program AppID registered for this purpose.
      type: string
      minLength: 1
      examples:
        - <caller-mini-program-app-id>

    AccountWechatReturnTarget:
      type: object
      additionalProperties: false
      required:
        - redirectURI
        - miniProgramAppID
      properties:
        redirectURI:
          description: An exact registered OAuth callback for this client. Preview wildcard rules do not apply.
          type: string
          minLength: 1
          format: uri
        miniProgramAppID:
          $ref: "#/components/schemas/AccountWechatMiniProgramAppID"
      description: |
        Original calling mini program and its corresponding OAuth callback. No AppSecret or internal page route is
        registered.
      examples:
        - redirectURI: https://xatom.example.com/account/callback
          miniProgramAppID: <caller-mini-program-app-id>

    OAuthUILocales:
      description: |
        Preferred UI locales as space-separated BCP 47 language tags. Select a supported preference when available
        and otherwise use the default locale.
      type: string
      minLength: 1
      maxLength: 256
      pattern: "^[A-Za-z]{2,8}(?:-[A-Za-z0-9]{1,8})*(?: [A-Za-z]{2,8}(?:-[A-Za-z0-9]{1,8})*)*$"
      examples:
        - zh-CN zh en

    AccountUserIdentity:
      type: object
      description: Third-party identity linked to a user.
      required:
        - id
        - createdAt
        - updatedAt
        - provider
        - subject
      properties:
        id:
          $ref: "#/components/schemas/Model/properties/id"
        createdAt:
          $ref: "#/components/schemas/Model/properties/createdAt"
        updatedAt:
          $ref: "#/components/schemas/Model/properties/updatedAt"
        provider:
          $ref: "#/components/schemas/AccountProviderName"
        subject:
          description: Stable provider subject.
          type: string
          minLength: 1
        subjectNamespace:
          description: Provider subject namespace when needed for provider-scoped identifiers.
          type:
            - string
            - "null"
        displayName:
          description: Provider display name retained for display and troubleshooting.
          type:
            - string
            - "null"
        avatar:
          description: Provider avatar URL retained for display and troubleshooting.
          type:
            - string
            - "null"
          format: uri

    AccountSession:
      type: object
      description: Account session used by hosted sign-in and SSO continuity.
      required:
        - id
        - createdAt
        - updatedAt
        - lastUsedAt
        - expiresAt
        - facade
      properties:
        id:
          $ref: "#/components/schemas/Model/properties/id"
        createdAt:
          $ref: "#/components/schemas/Model/properties/createdAt"
        updatedAt:
          $ref: "#/components/schemas/Model/properties/updatedAt"
        lastUsedAt:
          description: Timestamp when the account session was last used.
          type: string
          format: date-time
          examples:
            - 2006-01-02T15:04:05+07:00
        expiresAt:
          description: Expiration timestamp.
          type: string
          format: date-time
          examples:
            - 2006-01-02T15:04:05+07:00
        userAgent:
          description: User agent associated with the account session.
          type:
            - string
            - "null"
        ipAddress:
          description: IP address associated with the account session.
          type:
            - string
            - "null"
        facade:
          $ref: "#/components/schemas/AccountFacade"

    CurrentAccountSession:
      type: object
      description: Current account session.
      required:
        - id
        - createdAt
        - updatedAt
        - lastUsedAt
        - expiresAt
        - user
        - facade
      properties:
        id:
          $ref: "#/components/schemas/AccountSession/properties/id"
        createdAt:
          $ref: "#/components/schemas/AccountSession/properties/createdAt"
        updatedAt:
          $ref: "#/components/schemas/AccountSession/properties/updatedAt"
        lastUsedAt:
          $ref: "#/components/schemas/AccountSession/properties/lastUsedAt"
        expiresAt:
          $ref: "#/components/schemas/AccountSession/properties/expiresAt"
        user:
          $ref: "#/components/schemas/AccountUser"
        userAgent:
          $ref: "#/components/schemas/AccountSession/properties/userAgent"
        ipAddress:
          $ref: "#/components/schemas/AccountSession/properties/ipAddress"
        facade:
          $ref: "#/components/schemas/AccountSession/properties/facade"

    AccountApp:
      type: object
      description: First-party app registered with XBuilder Account.
      required:
        - id
        - createdAt
        - updatedAt
        - name
        - displayName
        - avatar
        - description
        - status
      properties:
        id:
          $ref: "#/components/schemas/Model/properties/id"
        createdAt:
          $ref: "#/components/schemas/Model/properties/createdAt"
        updatedAt:
          $ref: "#/components/schemas/Model/properties/updatedAt"
        name:
          description: Unique app name.
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[A-Za-z0-9_-]{1,100}$"
          examples:
            - xbuilder
        displayName:
          description: Display name of the app.
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^\\P{White_Space}(?:[^\\r\\n]*\\P{White_Space})?$(?![\\s\\S])"
          examples:
            - XBuilder
        avatar:
          description: Public HTTP URL of the Account-managed app avatar, or `null` when unset.
          type:
            - string
            - "null"
          format: uri
          pattern: "^https?://"
        description:
          description: Optional plain-text app description.
          type:
            - string
            - "null"
          maxLength: 200
        status:
          description: App status.
          type: string
          enum:
            - active
            - disabled
          examples:
            - active

    AccountOAuthClient:
      type: object
      description: OAuth client configuration owned by an account app.
      required:
        - id
        - createdAt
        - updatedAt
        - appID
        - clientID
        - name
        - clientType
        - status
        - grantTypes
        - redirectURIs
        - redirectURIPatterns
        - clientCredentialsScopes
        - wechatReturnTargets
      properties:
        id:
          $ref: "#/components/schemas/Model/properties/id"
        createdAt:
          $ref: "#/components/schemas/Model/properties/createdAt"
        updatedAt:
          $ref: "#/components/schemas/Model/properties/updatedAt"
        appID:
          $ref: "#/components/schemas/Model/properties/id"
        clientID:
          $ref: "#/components/schemas/OAuthClientID"
        name:
          description: Management name unique within the owning app.
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[A-Za-z0-9_-]{1,100}$"
          examples:
            - web
        clientType:
          description: OAuth client authentication type.
          type: string
          enum:
            - public
            - confidential
          examples:
            - public
        status:
          description: Client status.
          type: string
          enum:
            - active
            - disabled
          examples:
            - active
        grantTypes:
          description: Allowed OAuth grant types.
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              - authorization_code
              - refresh_token
              - client_credentials
          examples:
            - - authorization_code
              - refresh_token
        redirectURIs:
          description: |
            Allowed redirect URIs.

            The server must require exact redirect URI matching. Production web redirect URIs must use `https`.

            Native app and loopback exceptions must be explicitly registered and validated by client type.
          type: array
          items:
            type: string
            format: uri
          uniqueItems: true
          examples:
            - - https://app.example.com/oauth/callback
        redirectURIPatterns:
          description: |
            Read-only redirect URI patterns for HTTPS preview environments.

            At most one wildcard in the leftmost subdomain label matches a nonempty fragment within that label.
            Hostnames are case-insensitive. Scheme, port, encoded path, and query must match exactly. Userinfo,
            fragments, and wildcards outside the hostname are rejected.
          readOnly: true
          type: array
          items:
            type: string
          examples:
            - - https://app-*.example.com/oauth/callback
        clientCredentialsScopes:
          description: |
            Approved scopes for app-only access.

            Only confidential clients using `client_credentials` may have a nonempty array.
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - account:app:read
              - account:user:read
        wechatReturnTargets:
          description: |
            Allowed original calling mini programs paired with exact OAuth callbacks. The pair must be unique. Empty for
            app-only clients. No caller AppSecret or internal mini program page route is included.
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/AccountWechatReturnTarget"

    AccountOAuthClientSecret:
      type: object
      description: OAuth client secret metadata for a confidential client.
      required:
        - id
        - createdAt
        - name
      properties:
        id:
          $ref: "#/components/schemas/Model/properties/id"
        createdAt:
          $ref: "#/components/schemas/Model/properties/createdAt"
        name:
          description: Client secret name. Must be unique among the client's active secrets.
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^\\P{White_Space}(?:[^\\r\\n]*\\P{White_Space})?$(?![\\s\\S])"
          examples:
            - production

    CreatedAccountOAuthClientSecret:
      description: Response returned after creating an OAuth client secret, including the one-time secret value.
      allOf:
        - $ref: "#/components/schemas/AccountOAuthClientSecret"
        - type: object
          required:
            - value
          properties:
            value:
              description: One-time client secret value.
              type: string
              minLength: 43
              maxLength: 43
              pattern: "^[A-Za-z0-9_-]{43}$"

    AccountAppGrant:
      type: object
      description: Authorization grant from an account user to an account app.
      required:
        - id
        - createdAt
        - updatedAt
        - appID
        - userID
        - scope
        - app
      properties:
        id:
          $ref: "#/components/schemas/Model/properties/id"
        createdAt:
          $ref: "#/components/schemas/Model/properties/createdAt"
        updatedAt:
          $ref: "#/components/schemas/Model/properties/updatedAt"
        appID:
          description: ID of the app authorized by the user.
          $ref: "#/components/schemas/Model/properties/id"
        userID:
          description: ID of the user who authorized the app.
          $ref: "#/components/schemas/Model/properties/id"
        scope:
          description: Account OAuth scope granted to the app.
          $ref: "#/components/schemas/OAuthScope"
        app:
          description: App authorized by the user.
          $ref: "#/components/schemas/AccountApp"
        lastUsedAt:
          description: Timestamp when the app grant was last used.
          type:
            - string
            - "null"
          format: date-time
          examples:
            - 2006-01-02T15:04:05+07:00
        revokedAt:
          description: Timestamp when the app grant was revoked.
          type:
            - string
            - "null"
          format: date-time
          examples:
            - null

    AccountAppToken:
      type: object
      description: Account-issued app-scoped OAuth token metadata.
      required:
        - id
        - createdAt
        - updatedAt
        - oauthClientID
        - grantID
        - tokenType
        - scope
        - name
        - expiresAt
      properties:
        id:
          $ref: "#/components/schemas/Model/properties/id"
        createdAt:
          $ref: "#/components/schemas/Model/properties/createdAt"
        updatedAt:
          $ref: "#/components/schemas/Model/properties/updatedAt"
        oauthClientID:
          description: ID of the OAuth client associated with the token.
          $ref: "#/components/schemas/Model/properties/id"
        grantID:
          description: ID of the app grant associated with the token.
          $ref: "#/components/schemas/Model/properties/id"
        tokenType:
          description: OAuth token type.
          type: string
          enum:
            - accessToken
            - refreshToken
          examples:
            - accessToken
        scope:
          description: Account OAuth scope associated with the token.
          $ref: "#/components/schemas/OAuthScope"
        name:
          description: Human-readable token name.
          type: string
          maxLength: 100
          examples:
            - SPX API testing
        expiresAt:
          description: Expiration timestamp.
          type: string
          format: date-time
          examples:
            - 2006-01-02T15:04:05+07:00
        lastUsedAt:
          description: Timestamp when the token was last used.
          type:
            - string
            - "null"
          format: date-time
          examples:
            - 2006-01-02T15:04:05+07:00
        consumedAt:
          description: Timestamp when the refresh token was consumed during rotation. Always null for access tokens.
          type:
            - string
            - "null"
          format: date-time
          examples:
            - null
        revokedAt:
          description: Timestamp when the token was revoked.
          type:
            - string
            - "null"
          format: date-time
          examples:
            - null

    CreateAccountAppTokenRequest:
      type: object
      description: |
        Request to create an Account-issued OAuth token for an app grant.

        The token scope is inherited from the associated app grant and cannot be overridden.
      required:
        - oauthClientID
        - tokenType
        - name
        - expiresAt
      properties:
        oauthClientID:
          description: ID of an active OAuth client for user authorization belonging to the grant's app.
          $ref: "#/components/schemas/Model/properties/id"
        tokenType:
          description: |
            OAuth token type to create.

            Currently, only `accessToken` is supported.
          type: string
          enum:
            - accessToken
          examples:
            - accessToken
        name:
          description: Human-readable token name.
          type: string
          minLength: 1
          maxLength: 100
          examples:
            - SPX API testing
        expiresAt:
          description: |
            Expiration timestamp of the created token. Must be in the future and no later than 365 days from creation.
          type: string
          format: date-time
          examples:
            - 2027-01-15T00:00:00Z

    CreatedAccountAppToken:
      description: Response returned after creating an account app token, including the one-time token value.
      allOf:
        - $ref: "#/components/schemas/AccountAppToken"
        - type: object
          required:
            - value
          properties:
            value:
              description: One-time token value. This value is not returned again after creation.
              type: string
              minLength: 1
              examples:
                - xb_at_2L5f8xQy...

    OAuthClientID:
      description: |
        OAuth client ID used in OAuth requests.

        New clients receive 22 unpadded Base64url characters. Existing clients may use a decimal identifier. Values are
        case-sensitive.
      type: string
      minLength: 1
      examples:
        - K7mR2qV9sT4wX6yZ8aB0Cg
        - "1"

    OAuthScope:
      description: |
        Space-delimited Account API scopes without duplicates.

        Delegated user access supports `account:user:read` and `account:user:write`. App-only access supports
        `account:app:read` and `account:user:read` when approved for the OAuth client.
      type: string
      minLength: 1
      pattern: "^account:(app:read|user:read|user:write)( account:(app:read|user:read|user:write))*$"
      examples:
        - account:user:read
        - account:user:write
        - account:user:read account:user:write
        - account:app:read account:user:read

    OAuthPKCECodeChallenge:
      description: Unpadded Base64url SHA-256 digest of the original verifier for PKCE S256.
      type: string
      minLength: 43
      maxLength: 43
      pattern: "^[A-Za-z0-9_-]{43}$"

    OAuthPKCECodeVerifier:
      description: PKCE code verifier.
      type: string
      minLength: 43
      maxLength: 128
      pattern: "^[A-Za-z0-9._~-]{43,128}$"

    OAuthPushedAuthorizationResponse:
      type: object
      description: Pushed authorization request response.
      required:
        - request_uri
        - expires_in
        - xbuilder_recovery_token
        - xbuilder_entry_token
        - xbuilder_entry_expires_in
      properties:
        request_uri:
          description: |
            Opaque pushed authorization request URI.

            The value is a short-lived, single-use reference and is not a dereferenceable URL.
          type: string
          format: uri
          minLength: 1
          examples:
            - urn:ietf:params:oauth:request_uri:6esc_11ACC5bwc014ltc14eY22c
        expires_in:
          description: Lifetime of the pushed authorization request in seconds.
          type: integer
          format: int64
          minimum: 1
          examples:
            - 600
          maximum: 600
        xbuilder_recovery_token:
          description: |
            Private backend credential for status, cancellation, and entry preparation. It cannot read codes or operate
            on authentication requests.
          $ref: "#/components/schemas/AccountOpaqueCredential"
        xbuilder_entry_token:
          description: One-time entry credential forwarded to the selected facade. It does not authorize result reads.
          $ref: "#/components/schemas/AccountOpaqueCredential"
        xbuilder_entry_expires_in:
          description: Entry credential lifetime in seconds, at most 60 and no longer than the PAR.
          type: integer
          format: int64
          minimum: 1
          maximum: 60
          examples:
            - 60
      examples:
        - request_uri: urn:ietf:params:oauth:request_uri:par_reference
          expires_in: 600
          xbuilder_recovery_token: RRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRR
          xbuilder_entry_token: EEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEE
          xbuilder_entry_expires_in: 60

    CreateOAuthTokenRequest:
      description: Request to create or refresh Account-issued OAuth tokens.
      oneOf:
        - $ref: "#/components/schemas/CreateAuthorizationCodeOAuthTokenRequest"
        - $ref: "#/components/schemas/CreateRefreshTokenOAuthTokenRequest"
        - $ref: "#/components/schemas/CreateClientCredentialsOAuthTokenRequest"
      discriminator:
        propertyName: grant_type
        mapping:
          authorization_code: "#/components/schemas/CreateAuthorizationCodeOAuthTokenRequest"
          refresh_token: "#/components/schemas/CreateRefreshTokenOAuthTokenRequest"
          client_credentials: "#/components/schemas/CreateClientCredentialsOAuthTokenRequest"

    CreateAuthorizationCodeOAuthTokenRequest:
      type: object
      description: Request to exchange an authorization code for Account-issued app-scoped OAuth tokens.
      required:
        - grant_type
        - code
        - redirect_uri
        - code_verifier
      properties:
        grant_type:
          description: OAuth grant type.
          type: string
          enum:
            - authorization_code
        code:
          description: Authorization code.
          type: string
          minLength: 1
        redirect_uri:
          description: Redirect URI used in the authorization request.
          type: string
          format: uri
        code_verifier:
          $ref: "#/components/schemas/OAuthPKCECodeVerifier"
        client_id:
          description: |
            OAuth client ID of the app.

            **Required when the client does not authenticate with the OAuth client authentication method
            `client_secret_basic`.**
          allOf:
            - $ref: "#/components/schemas/OAuthClientID"

    CreateRefreshTokenOAuthTokenRequest:
      type: object
      description: Request to refresh Account-issued app-scoped OAuth tokens.
      required:
        - grant_type
        - refresh_token
      properties:
        grant_type:
          description: OAuth grant type.
          type: string
          enum:
            - refresh_token
        refresh_token:
          description: Refresh token issued by XBuilder Account.
          type: string
          minLength: 1
        scope:
          description: OAuth scope requested for the refreshed access token.
          allOf:
            - $ref: "#/components/schemas/OAuthScope"
        client_id:
          description: |
            OAuth client ID of the app.

            **Required when the client does not authenticate with the OAuth client authentication method
            `client_secret_basic`.**
          allOf:
            - $ref: "#/components/schemas/OAuthClientID"

    CreateClientCredentialsOAuthTokenRequest:
      type: object
      description: |
        Request to create an app-only access token using `client_secret_basic` authentication.

        Scopes must be explicitly requested and approved for this confidential OAuth client. This grant does not issue a
        refresh token.
      required:
        - grant_type
        - scope
      not:
        required:
          - client_id
      properties:
        grant_type:
          description: OAuth grant type.
          type: string
          enum:
            - client_credentials
        scope:
          $ref: "#/components/schemas/OAuthScope"

    OAuthToken:
      type: object
      description: OAuth token response.
      required:
        - access_token
        - token_type
        - expires_in
        - scope
      properties:
        access_token:
          description: Account-issued OAuth access token.
          type: string
          minLength: 1
        token_type:
          description: OAuth token type.
          type: string
          enum:
            - Bearer
        expires_in:
          description: Lifetime of the access token in seconds.
          type: integer
          format: int64
          minimum: 1
          examples:
            - 300
        refresh_token:
          description: |
            Refresh token issued by XBuilder Account for user authorization when the OAuth client enables
            `refresh_token`. Omitted for `client_credentials`.
          type: string
          minLength: 1
        scope:
          description: Granted OAuth scope.
          allOf:
            - $ref: "#/components/schemas/OAuthScope"

    OAuthIntrospection:
      type: object
      description: OAuth token introspection response.
      required:
        - active
      properties:
        active:
          description: Whether the token is active.
          type: boolean
          examples:
            - true
        token_type:
          description: "`Bearer` for an active access token. Omitted for refresh tokens and inactive tokens."
          type: string
          enum:
            - Bearer
        sub:
          description: Stable user ID for delegated access, or `app:{appID}` for an app principal.
          type: string
          pattern: "^(app:)?[1-9][0-9]{0,18}$"
        client_id:
          description: OAuth client ID associated with the token.
          $ref: "#/components/schemas/OAuthClientID"
        scope:
          description: OAuth scope associated with the token.
          allOf:
            - $ref: "#/components/schemas/OAuthScope"
        exp:
          description: Expiration time as a Unix timestamp.
          type: integer
          format: int64
          minimum: 0
        iat:
          description: Issued-at time as a Unix timestamp.
          type: integer
          format: int64
          minimum: 0

    RevokeOAuthTokenRequest:
      description: Request to revoke an Account-issued OAuth token.
      oneOf:
        - $ref: "#/components/schemas/RevokeOAuthTokenWithClientAuthRequest"
        - $ref: "#/components/schemas/RevokeOAuthTokenWithClientIDRequest"

    RevokeOAuthTokenWithClientAuthRequest:
      type: object
      description: Token revocation request authenticated with OAuth client authentication.
      required:
        - token
      not:
        required:
          - client_id
      properties:
        token:
          description: OAuth token to revoke.
          type: string
          minLength: 1
        token_type_hint:
          description: |
            Hint about the type of token submitted for revocation.

            Known values include `access_token` and `refresh_token`.
          type: string
          minLength: 1
          examples:
            - access_token

    RevokeOAuthTokenWithClientIDRequest:
      type: object
      description: Token revocation request from a public client.
      required:
        - token
        - client_id
      properties:
        token:
          description: OAuth token to revoke.
          type: string
          minLength: 1
        token_type_hint:
          description: |
            Hint about the type of token submitted for revocation.

            Known values include `access_token` and `refresh_token`.
          type: string
          minLength: 1
          examples:
            - access_token
        client_id:
          description: OAuth client ID of the app.
          $ref: "#/components/schemas/OAuthClientID"

    OAuthError:
      type: object
      description: OAuth error response body.
      required:
        - error
      properties:
        error:
          description: OAuth error code.
          type: string
          minLength: 1
        error_description:
          description: Human-readable ASCII description of the error.
          type: string
          minLength: 1
        error_uri:
          description: URI identifying a human-readable web page with information about the error.
          type: string
          format: uri-reference

    AccountAuthenticationMethod:
      type: string
      enum:
        - wechat
        - qq
        - github
        - apple
        - google
        - x
        - password

    AccountAuthenticationAcquisition:
      type: string
      enum:
        - password
        - wechat_login
        - wechat_website
        - wechat_service_account
        - provider_redirect
        - external_browser
        - wechat_url_link

    AccountOpaqueCredential:
      description: Independent 32-byte secure random value encoded as unpadded Base64url. Never log or share it.
      type: string
      minLength: 43
      maxLength: 43
      pattern: "^[A-Za-z0-9_-]{43}$"

    AccountFlowVersion:
      description: |
        Version of the record whose state is being changed. A stale version returns `request_changed` unless the
        same operation can be recovered.
      type: integer
      format: int64
      minimum: 1

    AccountRequestURI:
      description: Opaque PAR reference. It locates the request but grants no authority to read results.
      type: string
      minLength: 1
      format: uri

    AuthenticationRequestID:
      description: Independent opaque public authentication request reference, not a PAR URN.
      type: string
      minLength: 1
      examples:
        - authentication_reference

    AccountRequestingApp:
      type: object
      additionalProperties: false
      required:
        - id
        - displayName
        - avatar
      properties:
        id:
          $ref: "#/components/schemas/Model/properties/id"
        displayName:
          $ref: "#/components/schemas/AccountApp/properties/displayName"
        avatar:
          $ref: "#/components/schemas/AccountApp/properties/avatar"
      description: Trusted display information resolved from the OAuth client and owning app registry.

    AccountAuthenticationOption:
      type: object
      additionalProperties: false
      required:
        - method
        - acquisition
      properties:
        method:
          $ref: "#/components/schemas/AccountAuthenticationMethod"
        acquisition:
          $ref: "#/components/schemas/AccountAuthenticationAcquisition"
      description: |
        A configured method and execution mode that this entry point can complete. Only options returned by the
        current context may be submitted.
      allOf:
        - if:
            properties:
              acquisition:
                type: string
                enum:
                  - password
            required:
              - acquisition
          then:
            properties:
              method:
                type: string
                enum:
                  - password
        - if:
            properties:
              acquisition:
                type: string
                enum:
                  - wechat_login
            required:
              - acquisition
          then:
            properties:
              method:
                type: string
                enum:
                  - wechat
        - if:
            properties:
              acquisition:
                type: string
                enum:
                  - wechat_website
            required:
              - acquisition
          then:
            properties:
              method:
                type: string
                enum:
                  - wechat
        - if:
            properties:
              acquisition:
                type: string
                enum:
                  - wechat_service_account
            required:
              - acquisition
          then:
            properties:
              method:
                type: string
                enum:
                  - wechat
        - if:
            properties:
              acquisition:
                type: string
                enum:
                  - wechat_url_link
            required:
              - acquisition
          then:
            properties:
              method:
                type: string
                enum:
                  - wechat
        - if:
            properties:
              acquisition:
                type: string
                enum:
                  - provider_redirect
            required:
              - acquisition
          then:
            properties:
              method:
                type: string
                enum:
                  - qq
                  - github
                  - apple
                  - google
                  - x
        - if:
            properties:
              acquisition:
                type: string
                enum:
                  - external_browser
            required:
              - acquisition
          then:
            properties:
              method:
                type: string
                enum:
                  - qq
                  - github
                  - apple
                  - google
                  - x

    AccountEntryPurpose:
      type: string
      enum:
        - authorize
        - return

    AccountAuthorizationRecoveryRequest:
      type: object
      additionalProperties: false
      required:
        - clientID
        - requestURI
        - recoveryToken
      properties:
        clientID:
          $ref: "#/components/schemas/OAuthClientID"
        requestURI:
          $ref: "#/components/schemas/AccountRequestURI"
        recoveryToken:
          $ref: "#/components/schemas/AccountOpaqueCredential"

    AccountAuthorizationEntry:
      type: object
      additionalProperties: false
      required:
        - entryPurpose
        - entryToken
        - entryExpiresAt
      properties:
        entryPurpose:
          $ref: "#/components/schemas/AccountEntryPurpose"
        entryToken:
          $ref: "#/components/schemas/AccountOpaqueCredential"
        entryExpiresAt:
          description: Entry credential deadline, at most 60 seconds and no later than the PAR or code deadline.
          type: string
          minLength: 1
          format: date-time
      description: |
        One-time entry information. Preparing it invalidates any previous unused entry credential and does not
        extend the request or code lifetime.
      examples:
        - entryPurpose: authorize
          entryToken: EEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEE
          entryExpiresAt: 2026-11-05T12:01:00Z

    OpenAccountAuthorizationRequest:
      type: object
      additionalProperties: false
      required:
        - clientID
        - requestURI
        - entryToken
        - facade
      properties:
        clientID:
          $ref: "#/components/schemas/OAuthClientID"
        requestURI:
          $ref: "#/components/schemas/AccountRequestURI"
        entryToken:
          $ref: "#/components/schemas/AccountOpaqueCredential"
        facade:
          $ref: "#/components/schemas/AccountFacade"
        sourceMiniProgramAppID:
          $ref: "#/components/schemas/AccountWechatMiniProgramAppID"
      allOf:
        - if:
            properties:
              facade:
                type: string
                enum:
                  - wechat
            required:
              - facade
          then:
            required:
              - sourceMiniProgramAppID
          else:
            not:
              anyOf:
                - required:
                    - sourceMiniProgramAppID

    AccountAuthorizationContextRequest:
      type: object
      additionalProperties: false
      required:
        - requestURI
      properties:
        requestURI:
          $ref: "#/components/schemas/AccountRequestURI"

    DecideAccountAuthorizationRequest:
      type: object
      additionalProperties: false
      required:
        - requestURI
        - expectedVersion
        - decision
      properties:
        requestURI:
          $ref: "#/components/schemas/AccountRequestURI"
        expectedVersion:
          $ref: "#/components/schemas/AccountFlowVersion"
        decision:
          type: string
          enum:
            - approve
            - deny
            - cancel
        expectedUserID:
          $ref: "#/components/schemas/Model/properties/id"
        expectedSessionID:
          $ref: "#/components/schemas/Model/properties/id"
      allOf:
        - if:
            properties:
              decision:
                type: string
                enum:
                  - approve
            required:
              - decision
          then:
            required:
              - expectedUserID
              - expectedSessionID
          else:
            not:
              anyOf:
                - required:
                    - expectedUserID
                - required:
                    - expectedSessionID

    AccountAuthorizationState:
      type: object
      required:
        - requestURI
        - version
        - status
        - state
      properties:
        requestURI:
          $ref: "#/components/schemas/AccountRequestURI"
        version:
          $ref: "#/components/schemas/AccountFlowVersion"
        status:
          type: string
          enum:
            - pending
            - authorized
            - denied
            - cancelled
            - expired
        state:
          description: Original OAuth state.
          type: string
          minLength: 1
        expiresAt:
          description: Original PAR deadline for unfinished authorization.
          type: string
          minLength: 1
          format: date-time
        codeAvailable:
          type: boolean
          description: Whether the issued authorization code can still be delivered by the original facade.
        codeExpiresAt:
          description: Fixed authorization code deadline, 5 minutes after issuance.
          type: string
          minLength: 1
          format: date-time
        unavailableReason:
          type: string
          enum:
            - consumed
            - expired
            - revoked
        oauthError:
          $ref: "#/components/schemas/OAuthError"
      description: |
        Shared authorization state. Consumption or expiry of a code does not overwrite the authorized terminal
        state.
      allOf:
        - if:
            properties:
              status:
                type: string
                enum:
                  - pending
            required:
              - status
          then:
            required:
              - expiresAt
            not:
              anyOf:
                - required:
                    - codeAvailable
                - required:
                    - codeExpiresAt
                - required:
                    - unavailableReason
                - required:
                    - oauthError
        - if:
            properties:
              status:
                type: string
                enum:
                  - authorized
            required:
              - status
          then:
            required:
              - codeAvailable
              - codeExpiresAt
            not:
              anyOf:
                - required:
                    - oauthError
        - if:
            properties:
              status:
                type: string
                enum:
                  - authorized
              codeAvailable:
                type: boolean
                enum:
                  - false
            required:
              - status
              - codeAvailable
          then:
            required:
              - unavailableReason
        - if:
            properties:
              status:
                type: string
                enum:
                  - authorized
              codeAvailable:
                type: boolean
                enum:
                  - true
            required:
              - status
              - codeAvailable
          then:
            not:
              anyOf:
                - required:
                    - unavailableReason
        - if:
            properties:
              status:
                type: string
                enum:
                  - denied
            required:
              - status
          then:
            required:
              - oauthError
            properties:
              oauthError:
                allOf:
                  - $ref: "#/components/schemas/OAuthError"
                  - properties:
                      error:
                        type: string
                        enum:
                          - access_denied
            not:
              anyOf:
                - required:
                    - codeAvailable
                - required:
                    - codeExpiresAt
                - required:
                    - unavailableReason
        - if:
            properties:
              status:
                type: string
                enum:
                  - cancelled
            required:
              - status
          then:
            required:
              - oauthError
            properties:
              oauthError:
                allOf:
                  - $ref: "#/components/schemas/OAuthError"
                  - properties:
                      error:
                        type: string
                        enum:
                          - access_denied
            not:
              anyOf:
                - required:
                    - codeAvailable
                - required:
                    - codeExpiresAt
                - required:
                    - unavailableReason
        - if:
            properties:
              status:
                type: string
                enum:
                  - expired
            required:
              - status
          then:
            required:
              - oauthError
            properties:
              oauthError:
                allOf:
                  - $ref: "#/components/schemas/OAuthError"
                  - properties:
                      error:
                        type: string
                        enum:
                          - invalid_request
            not:
              anyOf:
                - required:
                    - codeAvailable
                - required:
                    - codeExpiresAt
                - required:
                    - unavailableReason

    AuthorizationStatus:
      description: |
        Status-only response for the integrating app backend. It never contains an authorization code or
        authentication result.
      allOf:
        - $ref: "#/components/schemas/AccountAuthorizationState"
      unevaluatedProperties: false
      examples:
        - requestURI: urn:ietf:params:oauth:request_uri:par_reference
          version: 1
          status: pending
          state: state_reference
          expiresAt: 2026-11-05T12:10:00Z
        - requestURI: urn:ietf:params:oauth:request_uri:par_reference
          version: 4
          status: authorized
          state: state_reference
          codeAvailable: true
          codeExpiresAt: 2026-11-05T12:07:00Z
        - requestURI: urn:ietf:params:oauth:request_uri:par_reference
          version: 4
          status: authorized
          state: state_reference
          codeAvailable: false
          codeExpiresAt: 2026-11-05T12:07:00Z
          unavailableReason: consumed

    AuthorizationResult:
      description: |
        Authorization result delivered only to the original bound facade through the registered callback or mini
        program return channel. Account session changes do not change an already issued result.
      allOf:
        - $ref: "#/components/schemas/AccountAuthorizationState"
        - type: object
          required:
            - redirectURI
            - wechatReturnTarget
          properties:
            redirectURI:
              description: Original registered OAuth callback.
              type: string
              minLength: 1
              format: uri
            wechatReturnTarget:
              oneOf:
                - $ref: "#/components/schemas/AccountWechatReturnTarget"
                - type: "null"
            code:
              description: The same issued, valid, unconsumed authorization code. Never obtained through a recovery credential.
              type: string
              minLength: 1
        - if:
            properties:
              status:
                type: string
                enum:
                  - authorized
              codeAvailable:
                type: boolean
                enum:
                  - true
            required:
              - status
              - codeAvailable
          then:
            required:
              - code
          else:
            not:
              anyOf:
                - required:
                    - code
      unevaluatedProperties: false
      examples:
        - requestURI: urn:ietf:params:oauth:request_uri:par_reference
          version: 4
          status: authorized
          state: state_reference
          codeAvailable: true
          codeExpiresAt: 2026-11-05T12:07:00Z
          redirectURI: https://xatom.example.com/account/callback
          wechatReturnTarget:
            redirectURI: https://xatom.example.com/account/callback
            miniProgramAppID: <caller-mini-program-app-id>
          code: issued-account-authorization-code
        - requestURI: urn:ietf:params:oauth:request_uri:par_reference
          version: 3
          status: denied
          state: state_reference
          oauthError:
            error: access_denied
          redirectURI: https://xatom.example.com/account/callback
          wechatReturnTarget:
            redirectURI: https://xatom.example.com/account/callback
            miniProgramAppID: <caller-mini-program-app-id>

    AuthorizationContext:
      description: |
        Trusted authorization context for the bound facade. Authentication options and the current session may
        change while authorization is pending. An authorized context displays the original authorized account.
      allOf:
        - $ref: "#/components/schemas/AccountAuthorizationState"
        - type: object
          required:
            - app
            - scope
            - facade
            - wechatReturnTarget
            - authenticationRequestID
            - authenticationOptions
            - session
            - uiLocales
          properties:
            app:
              $ref: "#/components/schemas/AccountRequestingApp"
            scope:
              $ref: "#/components/schemas/OAuthScope"
            facade:
              $ref: "#/components/schemas/AccountFacade"
            wechatReturnTarget:
              oneOf:
                - $ref: "#/components/schemas/AccountWechatReturnTarget"
                - type: "null"
            authenticationRequestID:
              oneOf:
                - $ref: "#/components/schemas/AuthenticationRequestID"
                - type: "null"
            authenticationOptions:
              type: array
              items:
                $ref: "#/components/schemas/AccountAuthenticationOption"
              uniqueItems: true
            session:
              oneOf:
                - $ref: "#/components/schemas/CurrentAccountSession"
                - type: "null"
            authorizedUser:
              $ref: "#/components/schemas/AccountUser"
            uiLocales:
              oneOf:
                - $ref: "#/components/schemas/OAuthUILocales"
                - type: "null"
        - if:
            properties:
              status:
                type: string
                enum:
                  - authorized
            required:
              - status
          then:
            required:
              - authorizedUser
          else:
            not:
              anyOf:
                - required:
                    - authorizedUser
        - if:
            properties:
              facade:
                type: string
                enum:
                  - wechat
            required:
              - facade
          then:
            properties:
              wechatReturnTarget:
                $ref: "#/components/schemas/AccountWechatReturnTarget"
          else:
            properties:
              wechatReturnTarget:
                type: "null"
      unevaluatedProperties: false
      examples:
        - requestURI: urn:ietf:params:oauth:request_uri:par_reference
          version: 1
          status: pending
          state: state_reference
          expiresAt: 2026-11-05T12:10:00Z
          app:
            id: "2"
            displayName: XAtom
            avatar: null
          scope: account:user:read
          facade: wechat
          wechatReturnTarget:
            redirectURI: https://xatom.example.com/account/callback
            miniProgramAppID: <caller-mini-program-app-id>
          authenticationRequestID: null
          authenticationOptions:
            - method: wechat
              acquisition: wechat_login
            - method: password
              acquisition: password
            - method: google
              acquisition: external_browser
          session: null
          uiLocales: null

