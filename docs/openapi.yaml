      summary: Start fixed provider authentication in a helping browser
      description: |
        For `external_browser` acquisition only. After the user checks the original entry point and confirms the
        trusted context, bind the helping browser flow cookie and prepare the fixed provider address. Only this
        bound helper context can recover the same valid address after a lost response. Another context cannot
        replace the binding. Do not read, create, switch, refresh, or clear an Account session. Closing the page
        alone does not cancel authentication. The initiating entry point resumes the result and performs account
        confirmation.
      security:
        - accountFlowCookie: []
      parameters:
        - name: requestID
          in: path
          required: true
          description: Public authentication request reference.
          schema:
            $ref: "#/components/schemas/AuthenticationRequestID"
      requestBody:
