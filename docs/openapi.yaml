                enum:
                  - sign_in
              minItems: 1
              uniqueItems: true
            user:
              $ref: "#/components/schemas/AccountUser"

    CompleteAccountAuthenticationRequest:
      description: |
        Explicit account confirmation for primary authentication. The expected session is null when no session
        exists. Repeated completion must contain the same validated content, excluding `expectedVersion` from its
        digest.
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - expectedVersion
            - expectedSessionID
            - action
            - expectedUserID
          properties:
            expectedVersion:
              $ref: "#/components/schemas/AccountFlowVersion"
