        "400":
          $ref: "#/components/responses/AccountFlowBadRequest"
        "401":
          $ref: "#/components/responses/AccountFlowUnauthorized"
        "403":
          $ref: "#/components/responses/AccountFlowForbidden"
        "404":
          $ref: "#/components/responses/AccountFlowNotFound"
        "409":
          $ref: "#/components/responses/AccountFlowConflict"
        "410":
          $ref: "#/components/responses/AccountFlowExpired"
        "429":
          $ref: "#/components/responses/AccountFlowTooManyRequests"
        "500":
          $ref: "#/components/responses/AccountFlowInternalServerError"

  /account/authentication-requests/{requestID}/helper/cancel:
    post:
