      summary: Get public authentication assistance metadata
      description: |
        Return only trusted requester metadata, fixed method and purpose, initiating and executing facades,
        comparison code, status, and deadline. The public authentication reference does not authorize reading
        identity results, account actions, or session tokens. Display the same comparison code at both entry points
        and require the user to compare the trusted request context before starting. Helpers offer no method
        selection and never use or modify an existing Account session.
      security: []
      parameters:
        - name: requestID
          in: path
          required: true
