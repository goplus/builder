                properties:
                  content:
                    description: The consolidated archive content.
                    type: string
                    examples:
                      - "Complete conversation summary including new turns..."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenOrQuotaExceeded"
        "413":
          $ref: "#/components/responses/ContentTooLarge"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"

  /aigc/tasks:
    post:
      operationId: createAIGCTask
      tags:
        - AIGC
      summary: Create an AIGC task
      description: |
        Create an asynchronous AIGC task for resource-intensive generation and media-processing operations such as image
        generation, video generation, background removal, and video frame extraction.

        Use the returned task ID to poll for status via `GET /aigc/tasks/{taskID}` or subscribe to real-time updates via
        `GET /aigc/tasks/{taskID}/events`.

        Supported task types:

        | Type | Description |
        |------|-------------|
        | `removeBackground` | Remove image background |
        | `generateCostume` | Generate costume image |
        | `generateAnimationVideo` | Generate animation video |
        | `extractVideoFrames` | Extract frames from video |
        | `generateBackdrop` | Generate backdrop image |

        Each task consumes quota from the authenticated user's AIGC allowance based on the task type.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - title: removeBackground
                  type: object
                  required:
                    - type
                    - parameters
                  properties:
                    type:
                      type: string
                      enum:
                        - removeBackground
                    parameters:
                      description: Parameters for background removal.
                      type: object
                      required:
                        - imageUrl
                      properties:
                        imageUrl:
                          description: Universal URL of the image to remove background from, such as kodo://bucket/key.
                          type: string
                          format: uri
                          minLength: 1
                          examples:
                            - kodo://bucket/character.png
                - title: generateCostume
                  type: object
                  required:
                    - type
                    - parameters
                  properties:
                    type:
                      type: string
                      enum:
                        - generateCostume
                    parameters:
                      description: Parameters for costume generation.
                      type: object
                      required:
                        - settings
                      properties:
                        settings:
                          $ref: "#/components/schemas/AIGCCostumeSettings"
                        n:
                          description: Number of costume images to generate.
                          type: integer
                          minimum: 1
                          maximum: 4
                          default: 1
                          examples:
                            - 4
                - title: generateAnimationVideo
                  type: object
                  required:
                    - type
                    - parameters
                  properties:
                    type:
                      type: string
                      enum:
                        - generateAnimationVideo
                    parameters:
                      description: Parameters for animation video generation.
                      type: object
                      required:
                        - settings
                      properties:
                        settings:
                          $ref: "#/components/schemas/AIGCAnimationSettings"
                - title: extractVideoFrames
                  type: object
                  required:
                    - type
                    - parameters
                  properties:
                    type:
                      type: string
                      enum:
                        - extractVideoFrames
                    parameters:
                      description: Parameters for video frame extraction.
                      type: object
                      required:
                        - videoUrl
                        - duration
                      properties:
                        videoUrl:
                          description: Universal URL of the video to extract frames from, such as kodo://bucket/key.
                          type: string
                          format: uri
                          minLength: 1
                          examples:
                            - kodo://bucket/animation.mp4
                        startTime:
                          description: Start time in milliseconds from which to extract frames. Precision is 100ms.
                          type: integer
                          minimum: 0
                          multipleOf: 100
                          default: 0
                          examples:
                            - 0
                            - 1500
                        duration:
                          description: Segment extraction duration in milliseconds. Precision is 100ms.
                          type: integer
                          minimum: 0
                          multipleOf: 100
                          maximum: 60000
                          examples:
                            - 3000
                            - 10000
                        interval:
                          description: Interval between frames in milliseconds. Precision is 100ms.
                          type: integer
                          minimum: 100
                          multipleOf: 100
                          maximum: 1000
                          default: 100
                          examples:
                            - 100
                - title: generateBackdrop
                  type: object
                  required:
                    - type
                    - parameters
                  properties:
                    type:
                      type: string
                      enum:
                        - generateBackdrop
                    parameters:
                      description: Parameters for backdrop generation.
                      type: object
                      required:
                        - settings
                      properties:
                        settings:
                          $ref: "#/components/schemas/AIGCBackdropSettings"
                        n:
                          description: Number of backdrop images to generate.
                          type: integer
                          minimum: 1
                          maximum: 4
                          default: 1
                          examples:
                            - 4
      responses:
        "202":
          description: Task accepted and queued for processing.
          headers:
            Location:
              description: Canonical route of the created AIGC task.
              schema:
                type: string
                format: uri-reference
                minLength: 1
                examples:
                  - /aigc/tasks/1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIGCTask"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenOrQuotaExceeded"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"

  /aigc/tasks/{taskID}:
    get:
      operationId: getAIGCTask
      tags:
        - AIGC
      summary: Get AIGC task status
      description: |
        Retrieve the current status of an AIGC task.

        Poll this endpoint to check if the task is complete. For real-time updates, use the SSE endpoint
        `GET /aigc/tasks/{taskID}/events` instead.
      parameters:
        - name: taskID
          description: The task ID to get.
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Model/properties/id"
      responses:
        "200":
          description: Task status retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIGCTask"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /aigc/tasks/{taskID}/events:
    get:
      operationId: subscribeAIGCTaskEvents
      tags:
        - AIGC
      summary: Subscribe to AIGC task events
      description: |
        Subscribe to real-time task status updates via Server-Sent Events.

        Before the stream is established, request validation, authentication, and task lookup failures use the normal
        JSON `APIError` responses. After the stream has started, task failures are delivered as `failed` events and
        transport failures close the connection.

        For an established stream, the first event is always a `snapshot` containing the current task state. This
        eliminates the need to call `GET /aigc/tasks/{taskID}` separately and avoids race conditions between fetching
        current state and subscribing to updates.

        The connection remains open until the task completes, is cancelled, or fails. If the task is already in a
        terminal state when connecting, the `snapshot` event will contain the final state and the connection will close
        immediately.

        Event types:

        | Event | Data | Description |
        |-------|------|-------------|
        | `snapshot` | Full `AIGCTask` object | Initial state, always sent first |
        | `cancelling` | `{}` | Task cancellation in progress |
        | `completed` | `{"result": {...}}` | Task completed successfully |
        | `cancelled` | `{}` | Task was cancelled |
        | `failed` | `{"error": {"reason": "...", "message": "..."}}` | Task failed |

        Example: task in progress

        ```
        GET /aigc/tasks/123/events

        event: snapshot
        data: {"id": "123", "status": "processing"}

        event: completed
        data: {"result": {"imageUrls": ["kodo://bucket/path/to/file.png"]}}
        ```

        Example: task already completed

        ```
        GET /aigc/tasks/456/events

        event: snapshot
        data: {"id": "456", "status": "completed", "result": {"imageUrls": ["kodo://bucket/path/to/file.png"]}}

        (connection closed)
        ```

        Example: task pending

        ```
        GET /aigc/tasks/789/events

        event: snapshot
        data: {"id": "789", "status": "pending"}

        event: completed
        data: {"result": {"imageUrls": ["kodo://bucket/path/to/file.png"]}}
        ```

        Example: task cancelled

        ```
        GET /aigc/tasks/123/events

        event: snapshot
        data: {"id": "123", "status": "processing"}

        event: cancelling
        data: {}

        event: cancelled
        data: {}

        (connection closed)
        ```
      parameters:
        - name: taskID
          description: The task ID to subscribe to.
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Model/properties/id"
      responses:
        "200":
          description: SSE stream established.
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events stream.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /aigc/tasks/{taskID}/cancellation:
    put:
      operationId: cancelAIGCTask
      tags:
        - AIGC
      summary: Cancel an AIGC task
      description: |
        Cancel a pending or processing AIGC task.

        Cancellation rules:

        | Current Status | Result |
        |----------------|--------|
        | `pending` | Immediately `cancelled`, quota refunded |
        | `processing` | Transitions to `cancelling`, then `cancelled` |
        | `cancelling` | No-op, returns current state |
        | `completed` | `409 Conflict` |
        | `cancelled` | No-op, idempotent, returns current state |
        | `failed` | `409 Conflict` |

        Quota refund:

        - Tasks cancelled from `pending` status receive a full quota refund.
        - Tasks cancelled from `processing` status do not receive a refund because resources are already consumed.

        If subscribed via `GET /aigc/tasks/{taskID}/events`, a `cancelling` event will be emitted when cancellation
        begins, followed by a `cancelled` event when complete.
      parameters:
        - name: taskID
          description: The task ID to cancel.
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Model/properties/id"
      responses:
        "202":
          description: Cancellation request accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIGCTask"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /aigc/project-descriptions:
    post:
      operationId: generateProjectDescription
      tags:
        - AIGC
      summary: Generate a project description
      description: |
        Generate an AI-powered descriptive summary of a game from the player's perspective based on provided game
        content such as spx source code and project structure.

        Each request consumes 1 quota from the authenticated user's AI description allowance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  description: Game content to summarize, such as spx source code or project structure.
                  type: string
                  minLength: 1
                  maxLength: 150000
                  examples:
                    - |
                      Game: TicTacToe
                      Description: A classic Tic-Tac-Toe game.

                      === File: main.spx ===
                      var (
                          // board is the main Tic-Tac-Toe board, where 1 represents "X" and 2 represents "O".
                          board [3][3]int
                      )

                      // onStart handles the game start event.
                      onStart => {
                        // ...
                      }
                knowledge:
                  description: Optional background knowledge used to ground project description generation.
                  type: string
                  maxLength: 120000
                  examples:
                    - |
                      # About spx

                      spx is a Scratch-like 2D Game Engine for STEM education.
      responses:
        "200":
          description: Successfully generated project description.
          content:
            application/json:
              schema:
                type: object
                required:
                  - description
                properties:
                  description:
                    description: AI-generated descriptive summary of the game world from the player's perspective.
                    type: string
                    examples:
                      - |
                        This is a Tic-Tac-Toe game played on a 3x3 grid. The player uses `X` marks while the AI opponent
                        uses `O` marks. Players take turns placing their marks in empty squares, with the goal of
                        getting three marks in a row horizontally, vertically, or diagonally. The game supports mouse
                        click interaction. Click on an empty square to place your mark. The game ends when either player
                        achieves three in a row or the board is completely filled.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenOrQuotaExceeded"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"

  /aigc/asset-descriptions:
    post:
      operationId: generateAssetDescription
      tags:
        - AIGC
      summary: Generate an asset description
      description: |
        Generate a description for an asset using AI based on the provided text prompt and image input.

        This endpoint accepts multimodal input to generate a contextual description suitable for embedding and search
        operations.

        The text prompt typically includes the asset's display name and additional context about how the description
        will be used.

        Image requirements:

        - The image format must be PNG (`image/png`).
        - The maximum image size is 5 MiB after decoding the base64 content.
        - Images must be provided as base64-encoded data URLs.
        - Other formats must be converted to PNG before sending.

        Each request consumes 1 quota from the authenticated user's AIGC allowance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: array
                  description: Array of content items including text and image inputs.
                  minItems: 1
                  maxItems: 10
                  items:
                    oneOf:
                      - $ref: "#/components/schemas/InputText"
                      - $ref: "#/components/schemas/InputImage"
                    discriminator:
                      propertyName: type
                      mapping:
                        inputText: "#/components/schemas/InputText"
                        inputImage: "#/components/schemas/InputImage"
            examples:
              tornado:
                summary: Generate description for a tornado sprite
                value:
                  content:
                    - type: inputText
                      text: "Generate a description for a sprite named 'Tornado'."
                    - type: inputImage
                      imageUrl: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=="
      responses:
        "200":
          description: Successfully generated description.
          content:
            application/json:
              schema:
                type: object
                required:
                  - description
                properties:
                  description:
                    type: string
                    description: The AI-generated description for the asset.
                    examples:
                      - "A powerful rotating column of air extending from a thunderstorm to the ground, characterized by its distinctive funnel shape and destructive force."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenOrQuotaExceeded"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"

  /aigc/asset-settings-enrichments:
    post:
      operationId: enrichAssetSettings
      tags:
        - AIGC
      summary: Enrich asset settings
      description: |
        Use AI to enrich partial asset settings with detailed descriptions and parameters.

        Each request consumes 1 quota from the authenticated user's AIGC allowance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - assetType
                - input
              allOf:
                - if:
                    required:
                      - assetType
                    properties:
                      assetType:
                        const: sprite
                  then:
                    properties:
                      settings:
                        $ref: "#/components/schemas/AIGCSpriteSettings"
                - if:
                    required:
                      - assetType
                    properties:
                      assetType:
                        const: costume
                  then:
                    properties:
                      settings:
                        $ref: "#/components/schemas/AIGCCostumeSettings"
                - if:
                    required:
                      - assetType
                    properties:
                      assetType:
                        const: animation
                  then:
                    properties:
                      settings:
                        $ref: "#/components/schemas/AIGCAnimationSettings"
                - if:
                    required:
                      - assetType
                    properties:
                      assetType:
                        const: backdrop
                  then:
                    properties:
                      settings:
                        $ref: "#/components/schemas/AIGCBackdropSettings"
              properties:
                assetType:
                  description: Type of asset to enrich settings for.
                  type: string
                  enum:
                    - sprite
                    - costume
                    - animation
                    - backdrop
                input:
                  description: User's text description of the asset.
                  type: string
                  minLength: 1
                  examples:
                    - A fire demon character with glowing ember cracks
                settings:
                  description: Optional partial settings to be enriched. Structure depends on assetType.
                  type: object
                spriteSettings:
                  description: Optional existing sprite settings to provide context for costume or animation enrichment.
                  $ref: "#/components/schemas/AIGCSpriteSettings"
                projectSettings:
                  description: Optional project settings to provide context for enrichment.
                  $ref: "#/components/schemas/AIGCProjectSettings"
                lang:
                  description: |
                    Language the AI should use for all generated text.

                    - When provided, the output strictly follows this language regardless of the input language.
                    - When omitted, the AI infers language from the user input.
                  type: string
                  enum:
                    - en
                    - zh
      responses:
        "200":
          description: Successfully enriched settings.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/AIGCSpriteSettings"
                  - $ref: "#/components/schemas/AIGCCostumeSettings"
                  - $ref: "#/components/schemas/AIGCAnimationSettings"
                  - $ref: "#/components/schemas/AIGCBackdropSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenOrQuotaExceeded"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"

  /aigc/sprite-content-settings:
    post:
      operationId: generateSpriteContentSettings
      tags:
        - AIGC
      summary: Generate sprite content settings
      description: |
        Generate costume and animation settings for a sprite based on its settings.

        Each request consumes 1 quota from the authenticated user's AIGC allowance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - settings
              properties:
                settings:
                  $ref: "#/components/schemas/AIGCSpriteSettings"
                lang:
                  description: |
                    Language the AI should use for all generated text.

                    - When provided, the output strictly follows this language regardless of the input language.
                    - When omitted, the AI infers language from the user input.
                  type: string
                  enum:
                    - en
                    - zh
      responses:
        "200":
          description: Successfully generated content settings.
          content:
            application/json:
              schema:
                type: object
                required:
                  - costumes
                  - animations
                  - animationBindings
                properties:
                  costumes:
                    description: Settings for costumes to generate.
                    type: array
                    items:
                      $ref: "#/components/schemas/AIGCCostumeSettings"
                  animations:
                    description: Settings for animations to generate.
                    type: array
                    items:
                      $ref: "#/components/schemas/AIGCAnimationSettings"
                  animationBindings:
                    description: |
                      Recommended mapping from sprite state enum values to animation names.

                      Keys and values:

                      - Keys are sprite state enum values.
                      - Values are animation name strings that should match the `name` field from the animations array.
                      - Omit a state when no animation is bound to it.
                    type: object
                    additionalProperties: false
                    properties:
                      default:
                        type: string
                      step:
                        type: string
                      die:
                        type: string
                    example:
                      default: "idle"
                      step: "walk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ForbiddenOrQuotaExceeded"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"

  /aigc/asset-adoptions:
    post:
      operationId: createAIGCAssetAdoption
      tags:
        - AIGC
      summary: Adopt an AIGC-generated asset
      description: |
        Record that an AIGC-generated asset has been adopted.

        The backend verifies task ownership and file provenance and may publish the adopted asset to the public library.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - taskIds
                - asset
              properties:
