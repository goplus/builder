version: 2

multi-ecosystem-groups:
  infrastructure:
    schedule:
      interval: weekly
  go-modules:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: github-actions
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: infrastructure
    ignore:
      # Codecov Action upgrades are handled manually.
      - dependency-name: "codecov/codecov-action"
  - package-ecosystem: gomod
    directories:
      - /tools/spxls
      - /tools/ai
    patterns:
      - "*"
    multi-ecosystem-group: go-modules
